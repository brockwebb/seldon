domain: research
version: "0.2"

# System properties set automatically on every artifact, regardless of type:
#   artifact_id    — UUID, set at creation
#   state          — domain-managed state machine value
#   authority      — 'proposed' | 'accepted' (AI proposes, human accepts)
#   created_at     — ISO-8601 UTC, set at creation
#   created_by     — actor string, set at creation
#   updated_at     — ISO-8601 UTC, set at every mutation (create, update, state change)
# These are written by seldon/core/artifacts.py and never declared per-type.

artifact_types:
  Script:
    properties:
      name:
        required: true
        description: "Human-readable script name"
      path:
        required: true
        description: "Filesystem path relative to project root"
      description:
        category: documentation
        description: "What this script does (1-2 sentences)"
      inputs:
        category: documentation
        description: "Input data files or parameters"
      outputs:
        category: documentation
        description: "What the script produces"
      parameters:
        category: documentation
        description: "Configurable parameters and their defaults"
      usage:
        category: documentation
        description: "How to run: command, arguments, environment"
      dependencies:
        category: documentation
        description: "Required packages, data files, other scripts"
      snapshot:
        category: system
        description: "Boolean, default false (AD-027). True means this artifact records the file as it stood at registration: content_hash is the identity of that state and the live file is expected to diverge. seldon verify skips snapshot artifacts in the drift check and reports them informationally; verify --fix and paper sync never rewrite their hash."

  Result:
    properties:
      name:
        category: system
        description: "Stable token key for {{result:NAME:field}} references. Case-sensitive, <=128 chars, unique per project graph. The slug grammar has a single definition point in code — `seldon.commands.result.RESULT_NAME_PATTERN` — and is deliberately not restated here; run `seldon result register --help` to see it. Not `required` here on purpose: `seldon result register` enforces --name for new registrations, while Results created before AD-028 have no name and must stay valid. See AD-028 and its Amendment 01."
      value:
        required: true
        description: "The numeric or categorical result value"
      units:
        required: true
        description: "Units of measurement. A real unit only — never a token key. See AD-028 and docs/conventions/result_units_vocabulary.md."
      description:
        required: true
        description: "What this result measures"
      interpretation:
        category: documentation
        description: "What the value means in context"
      methodology_note:
        category: documentation
        description: "Brief note on how it was computed"

  DataFile:
    properties:
      name:
        required: true
        description: "Filename"
      path:
        required: true
        description: "Filesystem path relative to project root"
      format:
        category: documentation
        description: "File format (CSV, JSON, JSONL, etc.)"
      schema_description:
        category: documentation
        description: "Columns/fields and their meanings"
      provenance_description:
        category: documentation
        description: "How this data was produced or obtained"
      row_count:
        category: documentation
        description: "Number of records (approximate is fine)"
      snapshot:
        category: system
        description: "Boolean, default false (AD-027). True means this artifact records the file as it stood at registration: content_hash is the identity of that state and the live file is expected to diverge. seldon verify skips snapshot artifacts in the drift check and reports them informationally; verify --fix and paper sync never rewrite their hash."

  Figure:
    properties:
      name:
        required: true
        description: "Figure identifier (e.g., fig_1_convergence)"
      caption:
        required: true
        description: "Figure caption text"
      description:
        required: true
        description: "What the figure shows"
      figure_number:
        category: system
        description: "Display number (e.g., '2.3' for Chapter 2, Figure 3) — computed from graph position at build time"
      interpretation:
        category: documentation
        description: "Key takeaway from this figure"
      data_source:
        category: documentation
        description: "Which DataFiles/Results this figure renders"
      file_path:
        category: documentation
        description: "Path to the generated figure file"

  Table:
    properties:
      name:
        required: true
        description: "Table identifier (e.g., 'table_comparison_results')"
      caption:
        required: true
        description: "Table caption text"
      table_number:
        category: system
        description: "Display number (e.g., '5.1' for Chapter 5, Table 1) — computed from graph position at build time"
      generating_script:
        category: documentation
        description: "Name of Script artifact that produces this table"
      data_sources:
        category: documentation
        description: "DataFile artifacts that feed this table"
      file_path:
        category: documentation
        description: "Path to generated table file if applicable"

  PipelineRun:
    properties:
      script_id:
        required: true
        description: "Artifact ID of the Script that was run"
      run_timestamp:
        required: true
        description: "When the run started"
      environment:
        category: documentation
        description: "Python version, OS, key package versions"
      runtime:
        category: documentation
        description: "Wall-clock time"
      reproduction_command:
        category: documentation
        description: "Exact command to reproduce this run"

  PaperSection:
    properties:
      name:
        required: true
        description: "Section identifier"
      title:
        required: true
        description: "Section title"
      file_path:
        category: system
        description: "Path to the section markdown file"
      content_hash:
        category: system
        description: "SHA-256 hash of file content at last sync"
      snapshot:
        category: system
        description: "Boolean, default false (AD-027). True means this artifact records the file as it stood at registration: content_hash is the identity of that state and the live file is expected to diverge. seldon verify skips snapshot artifacts in the drift check and reports them informationally; verify --fix and paper sync never rewrite their hash."
      sequence:
        category: system
        description: "Ordering within parent (1, 2, 3...). Determines document order and figure/table numbering."
      depth:
        category: system
        description: "Hierarchy depth: 0 = chapter/top-level, 1 = section, 2 = subsection"
      section_type:
        category: system
        description: "Type of section: 'chapter', 'section', 'frontmatter', 'backmatter', 'appendix'. Determines numbering behavior. Defaults to 'chapter' for depth=0, 'section' for depth>0."
      core_argument:
        category: documentation
        description: "1-2 sentence thesis — what this section argues, not what it covers"
      claims:
        category: documentation
        description: "Key falsifiable assertions established (list of strings)"
      terminology_defined:
        category: documentation
        description: "Terms defined or given specific meaning. Each entry: 'term: definition' (list of strings)"
      forward_promises:
        category: documentation
        description: "Topics promised to downstream sections. Each entry: 'chapter-NN: topic' (list of strings)"
      open_threads:
        category: documentation
        description: "Topics acknowledged but deferred (list of strings)"
      anchor_date:
        category: system
        description: "ISO date when anchor properties were last populated"
      anchor_source:
        category: system
        description: "How anchors were generated (e.g., 'AD-020 run 005', 'direct read', 'manual')"

  Citation:
    properties:
      key:
        required: true
        description: "BibTeX key"
      title:
        required: true
        description: "Paper/source title"

  ResearchTask:
    properties:
      description:
        required: true
        description: "What needs to be done"
      terminal_reason:
        # `system`, not `documentation`: absence is the normal case for every task
        # that ended any other way, so counting it as a documentation gap would
        # manufacture one false gap per completed task. Same reasoning as AD-027's
        # `snapshot` — conditionally-set operator input, not authored prose.
        category: system
        description: "Why the task was withdrawn or superseded. Required by `seldon task withdraw` / `seldon task supersede`; absent on tasks that reached a terminal state before AD-028. See AD-028."
      claimed_by:
        category: system
        description: "Agent identifier that took the task in_progress ('desktop', 'cc', or a caller-supplied id). Set on the accepted -> in_progress transition. See AD-028."
      claimed_at:
        category: system
        description: "ISO-8601 UTC timestamp of the accepted -> in_progress transition that set claimed_by. Advisory: staleness is reported, never auto-released. See AD-028."

  LabNotebookEntry:
    properties:
      summary:
        required: true
        description: "Session summary"

  SRS_Requirement:
    properties:
      requirement_id:
        required: true
        description: "Formal requirement identifier (e.g., FR-001)"
      description:
        required: true
        description: "What the requirement specifies"

  AgentRole:
    properties:
      name:
        required: true
        description: "Role identifier (e.g., verifier, methods, red_team)"
      display_name:
        required: true
        description: "Human-readable role name"
      system_prompt:
        required: true
        description: "Full system prompt for a CC worker assuming this role"
      responsibilities:
        category: documentation
        description: "What this role is responsible for"
      retrieval_profile:
        category: documentation
        description: "What graph context this role needs"
      cli_tools:
        category: documentation
        description: "Which seldon CLI commands this role uses"
      checks_performed:
        category: documentation
        description: "What this role verifies or validates"
      does_not_do:
        category: documentation
        description: "Explicit boundaries"

  Workflow:
    properties:
      name:
        required: true
        description: "Workflow identifier"
      display_name:
        required: true
        description: "Human-readable workflow name"
      description:
        required: true
        description: "What this workflow accomplishes"
      trigger:
        category: documentation
        description: "When to use this workflow"
      decomposition_strategy:
        category: documentation
        description: "How the leader decomposes the directive"
      success_criteria:
        category: documentation
        description: "How to verify completion"
      notes:
        category: documentation
        description: "Lessons learned, caveats"

  OntologyTerm:
    properties:
      term_id:
        required: true
        description: "Namespaced identifier (e.g., 'ontology:validity:SFV')"
      name:
        required: true
        description: "Human-readable term name"
      definition:
        required: true
        description: "Canonical definition text"
      category:
        required: true
        description: "Term category (e.g., 'framework', 'sub_dimension', 'threat', 'severity', 'metric', 'countermeasure', 'classical_validity', 'terminology_decision', 'related_term')"
      source_vocabulary:
        required: true
        description: "Source vocabulary path (e.g., 'validity/VALIDITY_VOCABULARY.md')"
      citations:
        category: documentation
        description: "Source citation keys (e.g., '[Webb-2026a]')"
      namespace:
        category: system
        description: "Ontology namespace (e.g., 'ontology:validity')"
      inheritance:
        category: system
        description: "Inheritance mode on replicas: always 'read-only'"
      content_hash:
        category: system
        description: "SHA-256 of the definition text for change detection"
      epoch:
        category: system
        description: "Master epoch at which this term was created or last updated"

  Issue:
    properties:
      description:
        required: true
        description: "What the issue is — the problem statement"
      issue_type:
        required: true
        description: "Category of problem. Values: factual_error, citation_gap, unsupported_claim, terminology_inconsistency, internal_contradiction, missing_content, stale_content, structural_flow, style_formatting"
      importance:
        required: true
        description: "Eisenhower importance axis (intrinsic, rarely changes). Values: high, medium, low"
      urgency:
        required: true
        description: "Eisenhower urgency axis (contextual, changes with workflow). Values: high, medium, low"
      detection_method:
        required: true
        description: "How the issue was found. Values: automated_check, audit, incidental, build_failure"
      target:
        required: true
        description: "What needs to change to resolve it. Values: content, citation, terminology, data, structure"
      resolution_notes:
        category: documentation
        description: "What was done to resolve the issue — captured at resolution time"

  ArchitecturalDecision:
    properties:
      name:
        required: true
        description: "AD identifier (e.g., AD-017)"
      title:
        required: true
        description: "Human-readable title"
      path:
        required: true
        description: "Filesystem path relative to project root"
      description:
        required: true
        description: "One-sentence summary of the decision"
      rationale:
        category: documentation
        description: "Why this decision was made — key reasoning"
      alternatives_considered:
        category: documentation
        description: "Options that were evaluated and rejected"
      supersedes:
        category: documentation
        description: "AD identifier(s) this decision replaces, if any"
      constraints:
        category: documentation
        description: "What this decision constrains or requires downstream"

  DesignNote:
    properties:
      name:
        required: true
        description: "Short identifier (e.g., semantic_anchoring_and_narrative_logic)"
      title:
        required: true
        description: "Human-readable title"
      path:
        required: true
        description: "Filesystem path relative to project root"
      description:
        required: true
        description: "One-sentence summary of what this note analyzes or proposes"
      note_type:
        required: true
        description: "Category of note. Values: pattern_proposal, architecture_gap, lessons_learned, calibration_report, workflow_design, reference"
      provenance:
        category: documentation
        description: "Source or trigger for this analysis (e.g., paper reference, observed failure mode)"

  BuildRun:
    # Defined by AD-025 (DeerFlow as Build-Time Harness).
    # Emitted by a bounded-build orchestrator at run completion.
    # Schema doc: seldon/docs/architecture/build_run_event_schema.md
    # JSON schema: seldon/schemas/build_run.json
    properties:
      run_id:
        required: true
        description: "Unique run identifier (uuid4)"
      goal:
        required: true
        description: "The prompt or spec text that initiated the run"
      goal_hash:
        required: true
        description: "SHA-256 of the goal text, hex lowercase, for dedup/audit"
      plan_hash:
        required: true
        description: "SHA-256 of the orchestrator's planning-phase output"
      ad_reference:
        category: documentation
        description: "AD that authorizes this run (e.g., AD-025)"
      models_used:
        required: true
        description: "List of {provider, model, role, input_tokens, output_tokens, cache_creation_input_tokens, cache_read_input_tokens, invocations, cost_usd}"
      subagents:
        category: documentation
        description: "List of {name, role, invocations, cumulative_cost_usd} when the orchestrator runs subagent fan-out"
      files_produced:
        required: true
        description: "List of {path, content_hash, commit_sha, artifact_type, bytes}"
      validation_results:
        category: documentation
        description: "Object with seldon_verify (pass/fail/skipped), tests, lint, custom_checks"
      started_at:
        required: true
        description: "ISO-8601 UTC timestamp"
      completed_at:
        required: true
        description: "ISO-8601 UTC timestamp"
      duration_seconds:
        required: true
        description: "Wallclock duration"
      total_cost_usd:
        required: true
        description: "Sum across models_used[*].cost_usd"
      terminal_reason:
        required: true
        description: "Outcome: success, cost_overrun, wallclock_overrun, invocation_overrun, error, manual_kill"
      internal_trace_ref:
        required: true
        description: "Path or hash referencing the orchestrator's deep trace (e.g., DeerFlow state.db record)"
      notes:
        category: documentation
        description: "Operator-facing free text"

  GeneratedFile:
    # Generic file produced by a BuildRun. Use this when a more specific
    # Seldon artifact type (Script, AgentRole, ArchitecturalDecision, etc.)
    # does not fit. The BuildRun's `produces` edge points here.
    properties:
      path:
        required: true
        description: "Absolute path to the produced file"
      content_hash:
        required: true
        description: "SHA-256 of file contents at emission time"
      bytes:
        category: system
        description: "File size in bytes"
      role:
        category: documentation
        description: "Free-form role tag (e.g., persona_prompt, retrieval_contract, integration_glue)"
      commit_sha:
        category: system
        description: "Git SHA if the file is committed; null if uncommitted"

  AuditRun:
    # AD-019 + AD-020 audit pipeline run. Produced by `seldon_audit` MCP tool
    # or by the auditor agent. Each run is a terminal record — by the time
    # Seldon sees it, the audit has finished. State machine has a single
    # `completed` state plus retirement states.
    properties:
      run_id:
        required: true
        description: "Sequential run identifier (e.g., 'run-003')"
      date:
        required: true
        description: "ISO date the audit ran (YYYY-MM-DD)"
      model:
        required: true
        description: "Resolved AUDIT_MODEL string (e.g., 'gemini/gemini-2.5-flash')"
      pipeline:
        category: documentation
        description: "Pipeline lineage (e.g., 'AD-019 + AD-020')"
      run_type:
        category: documentation
        description: "discovery | tevv_verification | dual_model_divergence"
      run_dir:
        category: documentation
        description: "Relative path to the run directory inside the project"
      document_type:
        category: documentation
        description: "academic_paper | book_chapter | technical_report"
      gates_run:
        category: documentation
        description: "List of gates that completed successfully"
      gates_failed:
        category: documentation
        description: "List of {gate, error} entries for gates that errored"
      findings_summary:
        category: documentation
        description: "Top-level finding counts by severity or by gate"
      sweep_synthesis:
        category: documentation
        description: "Brief synthesis text from sweep_synthesis.md if present"
      notes:
        category: documentation
        description: "Free-form notes from the manifest"

  AuditFinding:
    # Single finding extracted from an audit gate's YAML output. The text
    # may be a claim, a stress-test question, or a structural issue
    # depending on the originating gate.
    properties:
      finding_id:
        required: true
        description: "Stable id from the gate YAML (e.g., 'CA-06-01', 'PST-06-03')"
      finding_type:
        required: true
        description: "citation_gap | unsupported_claim | missing_content | terminology_inconsistency | stress_question | other"
      severity:
        required: true
        description: "blocking | high | medium | low | cosmetic"
      gate:
        required: true
        description: "Which gate produced it (content_audit, practitioner_stress_test, ...)"
      text:
        required: true
        description: "Short finding text (claim / question / issue)"
      section_slug:
        category: documentation
        description: "Section identifier the finding pertains to (e.g., '06_classical_crosswalk')"
      classification:
        category: documentation
        description: "fact | judgment | conjecture (content_audit gate only)"
      citation_status:
        category: documentation
        description: "cited | uncited | not_applicable (content_audit gate only)"
      notes:
        category: documentation
        description: "Longer auditor commentary"

relationship_types:
  cites:
    from_types: [PaperSection, Figure]
    to_types: [Result, Citation]
  generated_by:
    # DataFile added (AD-028): a derived data file is produced by a Script the
    # same way a Result is; ai-readiness-kg had to carry that edge as a property.
    from_types: [Result, Figure, Table, DataFile]
    to_types: [Script]
  computed_from:
    # DataFile -> DataFile added (AD-028): a derived data file is computed from
    # upstream data files, which is how provenance chains through intermediates.
    from_types: [Result, DataFile]
    to_types: [DataFile]
  implements:
    from_types: [Script, Result]
    to_types: [SRS_Requirement, ArchitecturalDecision]
  blocks:
    from_types: [ResearchTask]
    to_types: [Result, PaperSection, Figure]
  depends_on:
    from_types: [ResearchTask]
    to_types: [Result, DataFile, Script]
  validates:
    from_types: [Result]
    to_types: [Result]
  produced_by:
    from_types: [DataFile]
    to_types: [PipelineRun]
  contains:
    from_types: [Figure]
    to_types: [Result]
  derived_from:
    from_types: [Result]
    to_types: [LabNotebookEntry, Citation, Result]
  includes_role:
    from_types: [Workflow]
    to_types: [AgentRole]
  leads:
    from_types: [AgentRole]
    to_types: [Workflow]
  defines_sub_dimension:
    from_types: [OntologyTerm]
    to_types: [OntologyTerm]
  defines_threat:
    from_types: [OntologyTerm]
    to_types: [OntologyTerm]
  addresses_threat:
    from_types: [OntologyTerm]
    to_types: [OntologyTerm]
  measures_threat:
    from_types: [OntologyTerm]
    to_types: [OntologyTerm]
  precondition_for:
    from_types: [OntologyTerm]
    to_types: [OntologyTerm]
  references_ontology:
    from_types: [PaperSection, ResearchTask, LabNotebookEntry, DesignNote, ArchitecturalDecision]
    to_types: [OntologyTerm]

  contains_section:
    from_types: [PaperSection]
    to_types: [PaperSection]

  appears_in:
    from_types: [Figure, Table]
    to_types: [PaperSection]

  references_figure:
    from_types: [PaperSection]
    to_types: [Figure]

  references_table:
    from_types: [PaperSection]
    to_types: [Table]

  tabulates:
    from_types: [Table]
    to_types: [Result]

  context_for:
    from_types: [DataFile, Citation, LabNotebookEntry, PaperSection]
    to_types: [PaperSection, DataFile]

  cross_references:
    from_types: [PaperSection]
    to_types: [PaperSection]

  assumes:
    from_types: [PaperSection]
    to_types: [PaperSection]

  supports:
    from_types: [Result, Citation, DataFile, Figure, Table]
    to_types: [PaperSection]

  affects:
    from_types: [Issue]
    to_types: [PaperSection]

  blocked_by:
    from_types: [Issue]
    to_types: [Issue]

  related_issue:
    from_types: [Issue]
    to_types: [Issue]

  resolved_by:
    from_types: [Issue]
    to_types: [ResearchTask]

  remediated_by:
    from_types: [Issue]
    to_types: [PaperSection, ResearchTask, ArchitecturalDecision, DesignNote, Figure, Table, Script]

  informs:
    from_types: [DesignNote]
    to_types: [ArchitecturalDecision]

  supersedes:
    from_types: [ArchitecturalDecision]
    to_types: [ArchitecturalDecision]

  superseded_by:
    # AD-028: written by `seldon task supersede --superseded-by`. Points from the
    # task that was overtaken to the artifact that overtook it. Direction is the
    # inverse of `supersedes` on purpose — the transition is authored on the
    # losing side, and the replacement may not exist as an AD at all.
    from_types: [ResearchTask]
    to_types: [ResearchTask, ArchitecturalDecision, DesignNote, Result]

  corrects:
    # AD-028: an erratum note that corrects an earlier note or a published Result.
    # Surfaced by ai-readiness-kg ERRATUM-01, which had to carry its target as a
    # property because no edge type accepted it.
    from_types: [DesignNote]
    to_types: [DesignNote, Result]

  annotates:
    # AD-028: an Issue that adds commentary or caveat to a Result without
    # asserting the Result is wrong.
    from_types: [Issue]
    to_types: [Result]

  disputes:
    # AD-028: an Issue that asserts a Result is wrong. Distinct from `annotates`:
    # `disputes` is a claim about correctness, `annotates` is not.
    from_types: [Issue]
    to_types: [Result]

  produces:
    # AD-025: BuildRun emits at completion with a list of produced artifacts.
    # The projection creates `produces` edges from the BuildRun to each
    # artifact whose type appears in the `files_produced[*].artifact_type`
    # field. GeneratedFile is the catch-all when no more-specific type fits.
    from_types: [BuildRun]
    to_types: [GeneratedFile, Script, AgentRole, Workflow, ArchitecturalDecision, DesignNote, ResearchTask, OntologyTerm]

  audited_in:
    # PaperSection participated in this AuditRun. Multiple AuditRun edges
    # accumulate over time as the section is re-audited.
    from_types: [PaperSection]
    to_types: [AuditRun]

  has_finding:
    # AuditRun owns the AuditFinding artifacts it produced.
    from_types: [AuditRun]
    to_types: [AuditFinding]

  finding_in:
    # AuditFinding points to the PaperSection it pertains to (best-effort
    # match by section slug → PaperSection.name; absent if the section
    # has no graph artifact yet).
    from_types: [AuditFinding]
    to_types: [PaperSection]

state_machines:
  Result:
    proposed: [verified, rejected]
    verified: [published, stale]
    published: [stale]
    stale: [verified]
    rejected: []

  ResearchTask:
    # superseded (AD pattern): honest terminal for a task overtaken/obsoleted
    # *before* it finishes. Reachable only from active, non-finished states.
    # NOT reachable from completed/verified — relabeling a finished task would
    # corrupt the honest completion record. See cc_tasks/2026-06-18_cc_task_
    # researchtask_superseded_terminal.md.
    #
    # withdrawn (AD-028): honest terminal for a task whose *premise* turned out
    # false — the work was never valid to do, as opposed to `superseded`, where
    # the work was valid but something else overtook it. Same reachability as
    # superseded: active states only, never from completed/verified.
    proposed: [accepted, rejected, superseded, withdrawn]
    accepted: [in_progress, superseded, withdrawn]
    in_progress: [completed, blocked, superseded, withdrawn]
    completed: [verified]
    blocked: [in_progress, superseded, withdrawn]
    verified: []
    rejected: []
    superseded: []
    withdrawn: []

  Script:
    proposed: [active, deprecated]
    active: [deprecated, stale]
    deprecated: []
    stale: [active]

  DataFile:
    proposed: [registered]
    registered: [stale]
    stale: [registered]

  PaperSection:
    # AD-020: `audited` is reachable from any active editing state so that
    # `seldon_audit_ingest` can mark sections that have completed an audit
    # pass. From `audited`, sections return to revision (draft/review) or
    # retire to stale.
    proposed: [draft, review, audited]
    draft: [review, audited, stale]
    review: [published, draft, audited]
    audited: [draft, review, stale]
    published: [stale]
    stale: [draft]

  Figure:
    proposed: [draft, review]
    draft: [review, stale]
    review: [published, draft]
    published: [stale]
    stale: [draft]

  Table:
    proposed: [draft, review]
    draft: [review, stale]
    review: [published, draft]
    published: [stale]
    stale: [draft]

  Citation:
    proposed: [verified]
    verified: [stale]
    stale: [verified]

  LabNotebookEntry:
    proposed: [finalized]
    finalized: []

  SRS_Requirement:
    proposed: [accepted, rejected]
    accepted: [implemented, stale]
    implemented: [verified]
    verified: [stale]
    stale: [accepted]
    rejected: []

  PipelineRun:
    proposed: [running]
    running: [completed, failed]
    completed: [stale]
    failed: [proposed]
    stale: []

  AgentRole:
    proposed: [active, rejected]
    active: [deprecated, stale]
    deprecated: []
    stale: [active]
    rejected: []

  Workflow:
    proposed: [active, rejected]
    active: [deprecated, stale]
    deprecated: []
    stale: [active]
    rejected: []

  OntologyTerm:
    proposed: [active]
    active: [stale, deprecated]
    stale: [active]
    deprecated: []

  Issue:
    open: [in_progress, resolved, wont_fix]
    in_progress: [resolved, blocked, open]
    blocked: [in_progress, open]
    resolved: [verified, open]
    verified: []
    wont_fix: [open]

  ArchitecturalDecision:
    proposed: [accepted, rejected]
    accepted: [superseded, stale]
    superseded: []
    stale: [accepted]
    rejected: []

  DesignNote:
    proposed: [active]
    active: [stale, deprecated]
    stale: [active]
    deprecated: []

  BuildRun:
    # AD-025: BuildRun is emitted as a terminal record. It does not transition
    # through running/queued states inside Seldon — those live in the
    # orchestrator's own state.db. By the time Seldon sees a BuildRun, the
    # run is already finished. Distinguish success vs failure via
    # `terminal_reason` and `validation_results.seldon_verify` rather than
    # via the artifact state machine.
    proposed: [completed, failed, archived]
    completed: [archived, stale]
    failed: [archived]
    archived: []
    stale: [archived]

  GeneratedFile:
    proposed: [active, stale]
    active: [stale, deprecated]
    stale: [active, deprecated]
    deprecated: []

  AuditRun:
    # An AuditRun is created in `completed` state — by the time Seldon sees
    # it the audit has finished. Retired runs go to `archived` (kept for
    # provenance, not actively referenced) or `stale` (superseded by a
    # newer run on the same sections).
    proposed: [completed, archived]
    completed: [archived, stale]
    stale: [archived]
    archived: []

  AuditFinding:
    # Findings are created as `open`. Resolution happens when the underlying
    # issue is fixed in the section; `wont_fix` is for findings the team
    # chooses to leave (e.g., scope-of-paper boundary).
    proposed: [open]
    open: [resolved, wont_fix]
    resolved: [open]
    wont_fix: [open]
