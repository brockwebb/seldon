    abstract: "Abstract This article defines and exemplifies multimedia learning and multimedia instruction, describes theoretical frameworks for multimedia learning and multimedia instruction, summarizes evidence-based principles for how to design multimedia instruction, and suggests future trends in multimedia research. Multimedia design principles for reducing extraneous processing include the coherence principle, signaling principle, redundancy principle, spatial contiguity principle, and temporal contiguity principle. Multimedia design principles for managing essential processing include the pre-training principle, segmenting principle, and modality principle. Multimedia design principles for fostering generative processing include the personalization principle, voice principle, embodiment principle, and generative activity principle. Research on multimedia learning represents an example of applying the science of learning to education, and stands as one of educational psychology’s success stories."
