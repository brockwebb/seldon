# graphs/seldon-biblio/intake/seeds.yaml: SEL-036 Part B's SEED SET, hand-written, the input of
# scripts/sel036/resolve.py. NOT a candidates file (graph.yaml's `intake:` reads corpus/candidates/ and the inbox,
# never this file): every value below is what the CITING TEXT says, and the resolver's answer, with the authority
# that gave it, is what reaches the catalog (scripts/sel036/build_candidates.py).
#
# Three sources, as the task names them:
#   1. the 72 governed `Citation` artifacts of seldon-seldon-self (2026-11-09), deduplicated to works; the map from
#      each artifact to its works is `governed:` at the end of this file;
#   2. AD-013 ADDENDUM 01 section 2;
#   3. SEL-035's list (cc_tasks/2026-11-09_SEL-035_*.md "Prior art") and the three this task adds to it.
#
# Fields: `id` (the manifest id), `kind` (work | standard | software | grey; grey is cataloged as squiddy kind `work`
# with `entry_kind: grey`), `title`, `authors`, `year`, and any identifier THE CITING TEXT states or the task names
# (`doi`, `arxiv`, `isbn`, `standard_number`, `repo`, `url`). An identifier given here is a QUERY: the resolver asks
# the authority for it and checks the answer's title against `title`. `texts` are documentation pages to snapshot.
# `cited_in` names the decisions and tasks that cite the entry (AD-NNN, SEL-NNN, or a note path).
