[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seldon"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "mcp>=1.0",
    "neo4j>=5.7",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
seldon = "seldon.cli:main"
seldon-mcp = "seldon.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    # SEL-063 (REVIEW-001 F-31): `dispatch.gate_command` in seldon.yaml runs `-n 6` (pytest-xdist), and its comment
    # relies on pytest-randomly reordering every run. Floors are the majors that measured gate ran on (3.8, 3.16).
    "pytest-xdist>=3.0",
    "pytest-randomly>=3.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["seldon*"]

[tool.setuptools.package-data]
"seldon.domain" = ["*.yaml"]
"seldon.templates" = ["*.yaml", "graph_spec/*.yaml"]
