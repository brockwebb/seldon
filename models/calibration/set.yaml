      library_id: lesson:2024-12-04_10_1177_1461444814538646
      title: 'Recommended for you: The Netflix Prize and the production of algorithmic culture'
      publication_date: '2014-06-23'
      locator: abstract
      manifest: /Users/brock/GitHub/squiddy/graphs/library/corpus/manifest.yaml
      abstract_whitespace: collapsed to single spaces
    original: How does algorithmic information processing affect the meaning of the word culture, and, by extension, cultural
      practice? We address this question by focusing on the Netflix Prize (2006–2009), a contest offering US$1m to the first
      individual or team to boost the accuracy of the company’s existing movie recommendation system by 10%. Although billed
      as a technical challenge intended for engineers, we argue that the Netflix Prize was equally an effort to reinterpret
      the meaning of culture in ways that overlapped with, but also diverged in important respects from, the three dominant
      senses of the term assayed by Raymond Williams. Thus, this essay explores the conceptual and semantic work required
      to render algorithmic information processing systems legible as forms of cultural decision making. It also then represents
      an effort to add depth and dimension to the concept of “algorithmic culture.”
    planted: How does algorithmic information processing affect the meaning of the word culture, and, by extension, cultural
      practice? We address this question by focusing on the Netflix Prize (2006–2009), a five-year contest offering US$1m
