# The model registry: INTENT, one row per role (AD-035 R1).
#
# A role is named by its use. It names either a model FAMILY, resolved to the family's newest
# member (the default), or one specific model id from the `models:` catalog below (AD-035-R9,
# MODEL-003). Neither is privileged; both are lines of configuration. The id a family resolves to,
# and whether a named model is served, are in `models.lock.yaml`, written only by
# `seldon models refresh` (R2, R10). A role naming a model the lock does not mark available fails
# as `model_unavailable`; it never falls back to the family head (R12).
#
# Every key of a role other than `family`, `model` and `uses` is a launch parameter, and must be
# one its model's catalog profile supports, with a supported value (R11), or the registry does not
# load.
# This is the manifest / lockfile split of npm, Cargo and Poetry: intent here, resolution there,
# and every launcher reads the lock through `seldon.models` (R3), never this file's family words
# and never an alias of its own (R4).
#
# `effort` is the CLI's `--effort` level: one of low, medium, high, xhigh, max. It is a declared
# input of the instrument, as the model id is (AD-036-R8, extending AD-035 R1, R3, R6), so every
# role names one and every launcher passes `--effort`. `default` is REFUSED: under AD-035 it passed
# no flag, so the level a role ran at was whatever the served model's own default happened to be,
# and the move to the 5.5 lock silently took every opus and sonnet role from high to medium. The
# levels below are the documented defaults of the models the lock serves today (the
# `refresh.documented_default_effort` table), so naming them changed no behavior on 2026-10-09;
# `document_extractor` and `demand_judge` stay `high`, which is what their pilots measured.
#
# Each role's `uses` names where the inventory (docs/evidence/model001/inventory.md, 2026-10-09)
# found it, and what each one ran before MODEL-001, so a later reader can see what the move to the
# family's newest member changed. Adding a role is an edit here; a launcher that names a role this
# file does not hold fails loudly (`seldon.models.UnknownRole`).

schema: 1

roles:
  primary:
    family: opus
    effort: medium
    uses: >-
      Claude Code sessions the seldon dispatcher launches (seldon/commands/dispatch.py). Before:
      whatever `claude` on PATH resolved, or `dispatch.model` if a project set it.
  extractor:
    family: sonnet
    effort: medium
    uses: >-
      squiddy per-section extraction (init_defaults.yaml engine.extract.roles.extractor: sonnet,
      which CLI 2.1.278 resolved to claude-sonnet-5); arnold-evidence the same.
  rater:
    family: sonnet
    effort: medium
    uses: squiddy rater (engine.extract.roles.rater, sonnet); arnold-evidence the same.
  adjudicator:
    family: opus
    effort: medium
    uses: >-
      squiddy adjudicator (engine.extract.roles.adjudicator, opus, which 2.1.278 resolved to
      claude-opus-5); icsp_notebook conflict adjudication and consensus passes (claude-opus-4-8).
  teacher:
    family: opus
    effort: medium
    uses: squiddy graphs/library/extract/control.yaml teacher (alias opus, claude-opus-5 under 2.1.278).
  judge:
    family: fable
    effort: high
    uses: >-
      The independent judge or rater: squiddy Q-005 judge and arnold-evidence judge
      (claude-fable-5-1); ai-readiness-kg independent raters (er_gold_rate, g1_calibration_rate,
      homograph and link judges' independent samples, claude-fable-5-1).
  background:
    family: haiku
    effort: medium
    uses: >-
      The CLI's background and side calls (ANTHROPIC_DEFAULT_HAIKU_MODEL), and cleanup or control
      work: ai-readiness-kg cleanup_model_id and the G1 control consumer (claude-haiku-4-5-20251001).
  document_extractor:
    family: opus
    effort: high
    uses: >-
      ai-readiness-kg whole-document extraction (kg/extraction/model_config.yaml model_id
      claude-opus-5, effort high).
  consumer:
    family: opus
    effort: medium
    uses: >-
      ai-readiness-kg G1 consumer (assessment/config/g1_consumer.toml model_id claude-opus-5). A
      frozen instrument: a bump re-pilots it (AD-035 R7, H-006 R-30).
  secondary_rater:
    family: sonnet
    effort: medium
    uses: ai-readiness-kg probe secondary judge (model_config.yaml secondary_judge_model_id, claude-sonnet-5).
  question_generator:
    family: opus
    effort: medium
    uses: arnold-evidence KG-001 downstream test questions (claude-opus-5-5).
  descriptor_selector:
    family: sonnet
    effort: medium
    uses: arnold-evidence SEED-001 descriptor selection (claude-sonnet-5-5).
  label_proposer:
    family: sonnet
    effort: medium
    uses: arnold-evidence KG-002 lookup label proposals (claude-sonnet-5-5).
  shelf_screener:
    family: sonnet
    effort: medium
    uses: arnold-evidence KG-002 shelf screen (claude-sonnet-5-5).
  parser:
    family: sonnet
    effort: medium
    uses: >-
      arnold reply and email parsing (config/email_ingest.yaml parse_model claude-sonnet-4-6;
      config/arnold.yaml model claude-sonnet-4-20250514).
  triage:
    family: sonnet
    effort: medium
    uses: measuring-ai-economy harvester triage (sources.yaml triage_model claude-sonnet-4-6).
  battery_client:
    family: sonnet
    effort: medium
    uses: >-
      icsp_notebook REG battery's default client (tests/reg_battery/runner.py; before MODEL-001
      the CLI alias sonnet). Added from that repository's Part C report.
  critic:
    family: sonnet
    effort: medium
    uses: arnold seed Critic (src/arnold/seeding/critic.py; before MODEL-001 the CLI alias sonnet).
  coach:
    family: opus
    effort: medium
    uses: arnold morning brief agents (scripts/morning_brief.py; expected claude-opus-4-7) and skycoach.
  exercise_mapper:
    family: sonnet
    effort: medium
    uses: >-
      arnold exercise mappers (scripts/importers/map_failures_sonnet45.py, claude-sonnet-4-5;
      scripts/mappers/map_custom_to_canonical.py, claude-3-5-haiku). One role for one task: the
      later failure pass had already moved this task from Haiku up to Sonnet.
  quality_rater_primary:
    family: opus
    effort: medium
    uses: squiddy quality controls, primary rater (tools/run_quality_controls.py and the H-011 pilots).
  quality_rater_secondary:
    family: haiku
    effort: medium
    uses: squiddy quality controls, secondary rater, a deliberately different, smaller family.
  register_statement:
    family: sonnet
    effort: low
    uses: >-
      AD-033-R8's statement writer and its separate validator (scripts/sel002/statements.py's
      prompts, driven for PA-001 by scripts/pa001/statements_ad035_036.py). SEL-002 ran them on the
      alias sonnet at effort low: its pilot 2 measured up to 4,774 output tokens of thinking for a
      few lines of JSON at the default.
  auditor:
    family: opus
    effort: medium
    uses: >-
      seldon paper audit's default path (seldon/paper/audit_dispatch.py, the AD-019 content
      audit). Before PA-001 it launched `claude --print` from PATH with no `--model`, so it ran
      whatever the interactive CLI defaulted to (opus on the Max plan); MODEL-001's inventory missed
      it and PA-001's R9 search found it.
  demand_judge:
    family: fable
    effort: high
    uses: >-
      squiddy Q-005 demand judge (graphs/library/judge_run.yaml): Fable at effort high, which is
      what the sealed rounds measured. Fable's documented default is also `high`, so `judge` and
      this role now run at one level; they stay two roles because each is a frozen instrument
      and a change to either is a re-pilot of that one (AD-035 R7).
  author:
    model: claude-opus-4-8
    effort: high
    uses: >-
      ai-readiness-kg first-pass authoring: the executive summary v2
      (cc_tasks/2026-10-12_executive_summary_from_brief_v2.md), per the operator's ruling in
      docs/design/2026-10-12_DN-014_executive_summary_brief.md section 9 (Opus 4.8 writes the
      executive summary; it is the model of his book work). Effort `high` is the documented default
      for claude-opus-4-8 (catalog entry below), and the operator's book work ran before the 5.5
      models moved the default to medium; it is an assumption no pilot has measured (MODEL-003).

# AD-035-R10, R11: the model catalog, one parameter profile per Anthropic model id (`claude-*` only:
# MODEL-003 ADDENDUM 02 section 2; `load_registry` refuses any other prefix). `supported_params`
# maps each launch parameter to the values the model accepts; `effort: []` means it takes none, and
# then a role on it declares no effort and launches with no `--effort` flag and no
# CLAUDE_CODE_EFFORT_LEVEL. The shape is OpenRouter's per-model `supported_parameters` (a citation of
# shape, not a dependency). The family heads the documented-default table was read for have entries,
# so a family role's parameters are checked at load too; `resolve_role` checks them again against
# whatever head the lock serves, and a bump to a head with no entry is named `profile_missing` in
# the `models_lock_bumped` event.
#
# Source of the effort lists: the Claude API reference bundled with CLI 2.1.296 (the `claude-api`
# skill, "Thinking & Effort" table, cached 2026-10-06; excerpt in docs/evidence/model003/). The CLI
# itself does not validate `--effort` per model: it accepted `--effort bogus` with exit 0 on
# claude-opus-4-8 (docs/evidence/model003/opus_4_8_effort_probes.jsonl), so a CLI probe cannot
# measure which levels a model supports; it measures only that the model is served at each level.
# `default_effort` is used only when a task header names a non-head id instead of a role.
models:
  claude-fable-5-1:
    family: fable
    supported_params:
      effort: [low, medium, high, xhigh, max]
  claude-opus-5-5:
    family: opus
    supported_params:
      effort: [low, medium, high, xhigh, max]
  claude-sonnet-5-5:
    family: sonnet
    supported_params:
      effort: [low, medium, high, xhigh, max]
  claude-haiku-5-5:
    family: haiku
    supported_params:
      effort: [low, medium, high, xhigh, max]
  claude-opus-4-8:
    family: opus
    supported_params:
      effort: [low, medium, high, xhigh, max]
    # "default `high` (equivalent to omitting it) on every current model except Claude Opus 5.5 and
    # Claude Haiku 5.5" (bundled API reference, as above).
    default_effort: high

# AD-037-R2: the reading judge is the next tier above the generator, in a fresh context. Not a row of `roles:`,
# because it has no family of its own: `seldon.models.resolve("checker", generator=<role>)` maps the generator role's
# family through `tiers` and reads the id from the lock. Fable has no higher tier: its checker is a fresh Fable context
# reading an authorship-obfuscated text (S2, Mahbub and Feng 2026: a partial fix), and R3's measured catch rate
# carries the rest. `effort: high` is the level the portfolio's judges run at (`judge`, `demand_judge`).
checker:
  effort: high
  tiers:
    haiku: {family: sonnet}
    sonnet: {family: opus}
    opus: {family: fable}
    fable: {family: fable, obfuscate: true}

# AD-037-R3 and R5: judge calibration. `seldon qc calibrate-judge` writes one report per (judge id, generator id)
# under `report_dir`, so a lock bump of either voids it (AD-035-R7), and `seldon.models.resolve_judge` refuses a judge
# without a complete report that meets `bar`. The bar has no measured basis (AD-037-R3); FC-10 control limits replace
# it once three measurements exist. `z` is the two-sided 95% normal quantile.
calibration:
  report_dir: calibration/reports
  set: calibration/set.yaml
  z: 1.959964
  defect_label: defect
  bar:
    generator_catch_lower: 0.70
    n_min: 30

# `seldon models refresh` (AD-035 R2). Every value it uses is here, so a change is an edit.
refresh:
  # The npm package whose newest release is Anthropic's own alias resolver.
  npm_package: "@anthropic-ai/claude-code"
  # Versioned prefixes: `npm install --prefix <install_root>/<version>`, never the global install,
  # so no auto-updater replaces a binary a run is executing (squiddy H-006 R-30's measured defect).
  install_root: ~/.local/share/seldon/claude-cli
  # The executable inside a prefix. `.bin/claude` is npm's own link to the package's `bin` entry.
  bin_relpath: node_modules/.bin/claude
  # One probe per family alias. The families the lock resolves; R3 sets one env var per family.
  families: [fable, opus, sonnet, haiku]
  probe_prompt: "Reply with the single word OK."
  probe_timeout_s: 180
  npm_timeout_s: 600
  # The lock is re-resolved at most once per UTC day unless forced (R2: "cached for the day").
  cache: day
  # AD-035-R14 (SEL-009): the instant the day's cache turns over, HH:MM UTC. The day a refresh keys on is the date
  # of (now - this). There is NO clock job: the refresh runs at the first `seldon cc register` or dispatcher launch
  # after this instant with no run holding the lock (R13). `seldon models show` prints the next eligible instant.
  # "00:00" is the behaviour before SEL-009, when the operator remembered "about 00:49Z" and the bump came at 00:09Z.
  cache_boundary_utc: "00:00"
  # AD-035-R13 (SEL-009, implementing R7): a refresh defers while any of these repositories has a live dispatcher
  # lease (its `dispatch.lease_file`, or a worktree lease under `dispatch.lease_dir`), except the calling process's
  # own. Paths resolve against the seldon PRIMARY checkout, so a worktree reads the same list. Every sibling with a
  # `dispatch:` block is listed, and arnold and hazbrief-mcp too, which have none today and so hold nothing until they
  # do. A listed directory that does not exist fails the refresh loudly; the current lock then stands.
  holders: [., ../squiddy, ../ai-readiness-kg, ../arnold, ../hazbrief-mcp]
  # R13's other holder: a run that is not dispatched registers itself here for its whole life with
  # `seldon models hold --run <name> -- <command>` (or `seldon.models.hold(...)` in process). One flock per run.
  holds_dir: ~/.local/share/seldon/model-holds
  # Where each refresh writes its evidence, relative to the seldon repository root.
  evidence_dir: docs/evidence/model001
  # Commit the lock, the evidence and the event only when the checkout is on this branch; on any
  # other branch the files are written and the refresh says it did not commit.
  commit_branch: main
  # R2: refresh "runs when a task is authored and when a run starts". `seldon cc register` and the
  # dispatcher's launch call `seldon.models.ensure_fresh`, which refreshes only past the day's
  # cache and, if the refresh fails, keeps the current lock and warns (an offline registration is
  # not a reason to refuse one).
  auto_on_register: true
  auto_on_dispatch: true
  # AD-036-R8: each family's DOCUMENTED default effort, for the model the lock served when the
  # table was read. A product fact, not something a probe can measure, so it is read from the
  # source below and written here by hand. `refresh` copies it into the lock and records it in the
  # `models_lock_bumped` event; a family whose newly resolved model is not the one the table was
  # read for is named as `unverified` in that event, so a bump that moves a default is visible.
  # A launch that names a lock id instead of a role (`**Model:** claude-...`) runs at this level.
  documented_default_effort:
    source: https://code.claude.com/docs/en/model-config
    retrieved: '2026-10-09'
    note: >-
      Default effort moved from high on Opus 5 and Sonnet 5 to medium on the 5.5 models; Fable
      5.1 defaults to high.
    families:
      fable: {model: claude-fable-5-1, effort: high}
      opus: {model: claude-opus-5-5, effort: medium}
      sonnet: {model: claude-sonnet-5-5, effort: medium}
      haiku: {model: claude-haiku-5-5, effort: medium}
