# PA-001 Part C: the internal search tool's recall control (AD-036-R5). PRE-REGISTERED.
#
# Written and committed BEFORE the internal arm was run on the real corpus. Never edited after the
# run; a correction is a new file that names this one.
#
# Positive set: the 14 file:line entries of G5 problem 1's timeline
# (workbench/2026-10-03_audit_and_decision_probe/cross_project/synthesis/G5_governance.md:44-57)
# and the four ai-readiness-kg kg_construction_methodology.md lines AD-036 section 2 cites
# (section 1; section 7 rules 1 and 5; section 7.6): 18 entries. Section 7 rule 1 (line 68) is
# ALSO timeline entry 7, so 17 distinct locations carry 18 entries; each entry has its own query.
#
# Location resolution: each G5 path was resolved against the operator's machine on 2026-10-09
# (`.wintermute/` -> ~/.wintermute, `GitHub/<repo>/` and `squiddy/` -> ~/GitHub/<repo>/) and its
# line read at the commit named under `corpus`. Every cited line still holds the content G5 quotes
# at the same line number. A location counts as found when a returned paragraph of the same root
# and path spans its line.
#
# Queries: one per entry, written from the entry's TOPIC, never copying the entry's wording.
# AD-036-R5's three examples are used for the entries they name: "prior art search before
# design" (the methodology's prior-art-before-pilot rule), "unit of extraction" (the lab note),
# "model pin" (the Opus 5 pin rule).
#
# Tool: seldon/core/prior_art.py, TOOL_VERSION prior-art/1, internal arm, the corpus declared
# in seldon.yaml `prior_art.internal_roots` with `internal.default_include` (R3's list plus
# each repository's top-level docs/*.md, added before this file was written, rationale in
# seldon.yaml). Ranking BM25 k1 1.2, b 0.75, untuned.
#
# Statistic: recall at top 20 = (entries whose location is among the top 20 hits of its query)
# / 18. Interval: Wilson score, 95% (z = 1.959964). Pass bar: the interval's lower bound >= 0.70
# (AD-036-R5). A failure is reported with its misses and does not block the gate (Part B); it
# opens a design task for the governed-graph arm.
#
# Known before the run, stated so it is not discovered as a surprise: Wintermute's two handoffs
# and ai-readiness-kg's 2026-08-29 handoff are untracked in their repositories; the corpus reads
# them from disk. Lexical all-terms matching penalizes a topic query whose words the target does
# not use; that is what this control measures.

tool: prior-art/1
top_k: 20
z: 1.959964
bar_lower_bound: 0.70
corpus:
  # HEAD commits at pre-registration (2026-10-09). The run reports the commits it actually read.
  wintermute: 2a78c392f4d998227d2433338ea45aee82c67f1e
  ai-readiness-kg: 7e62f24e23b7ea8a61f9c68de906be3db6b8a162
  squiddy: 1cc6fc2d4e7b289737c1bccc210a6166707480ad  # main at MODEL-001's merge; a Part E agent may move it before the run
entries:
  - {id: G5-01, root: wintermute, path: docs/2026-06-07_labnote_entity_identity_restructure.md, line: 105,
     topic: "the same work duplicated three times in one session; no check whether it exists",
     query: "duplicate work"}
