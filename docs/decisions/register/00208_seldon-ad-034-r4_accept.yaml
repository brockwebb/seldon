  text: '- **AD-034-R4. Every write to main in the primary checkout happens under the pass lease; each worktree has its own lease, held by its supervisor.** The pass lease (`dispatch.lock`) is taken by a pass, which never waits for it, or by a finishing supervisor, which waits up to `merge_lock_timeout_s`. A per-worktree lease (`<lease_dir>/<stem>.lock`) names the supervisor''s PID from the moment the pass starts it, so the next pass never sees a gap; its release record keeps the task, worktree and branch. A worktree session works only in its worktree, so the gates that ask whether a session is working in the primary checkout ask it of the in-place claim alone.'
