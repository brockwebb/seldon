statement: '- **AD-038-R2. A halted task is redriven, not re-issued.** `blocked` gains the transition `blocked -> accepted`, taken by `seldon dispatch redrive <task>` (CLI and MCP), which clears `claimed_by`, records `dispatch_redrive` with the stop it answers, and leaves the task''s file, id and history intact. The dispatcher redrives automatically when the stop''s cause is one of its own recorded defects (a station that ran in the wrong tree, a database outage); any other cause waits for a redrive from a Desktop or CC session. **Basis:** SQS dead-letter redrive; measured (DESK-002''s halt cost one task file, one supersede and 44 minutes).'
