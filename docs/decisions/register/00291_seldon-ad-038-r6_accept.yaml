statement: '- **AD-038-R6. No new control enters the dispatcher without its own negative control and a toil measure.** Every station or gate added from here ships with a test that a correct session passes it, and `seldon qc chart` reports, per week, passes refused on machine dirt and operator interventions (pastes, restarts, re-issues). The target is zero of each; the chart is the evidence. **Basis:** SRE toil budget; Wheeler''s charts already adopted in AD-037-R8.'
