changes:
  statement: For each stage that produces a rate (quarantine, faithfulness, recall, yield, spend ratio), the quality control system shall apply specification limits, set either from the stage's pre-registered bar or the operator's band, and control limits computed from the stage's own baseline, using Shewhart three-sigma limits or a p-chart per lot for attribute rates. When a first reading for a rated stage is produced, the quality control system shall report the reading without gating on it. If a reading on a rated stage falls outside specification limits, then the quality control system shall stop the line per FC-28. If a reading on a rated stage falls outside control limits but within specification limits, then the quality control system shall open a huddle without stopping the line. A quality claim shall rest on lot sampling using Wald SPRT or ISO 2859-1, and shall never rest on a single pilot.
  statement_check: passed
