statement: '**AD-030-R6.** Citations are captured free and verified separately. Any citation appearing in a governed document becomes a Citation node at ingest in state `proposed`, with a Passage node (section or paragraph identifier, verbatim span, hash of source text) when a span was quoted. Verification is a state transition `proposed -> verified` carrying `method`, `date`, `by`. `seldon verify` reports unverified citations as it reports unregistered numbers. Gate intensity follows document type: design notes ship with `proposed` citations; `seldon paper build` refuses them at Tier 1.'
