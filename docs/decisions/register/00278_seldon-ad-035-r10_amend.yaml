changes:
  statement: 'The registry shall carry a `models:` catalog keyed by Anthropic model id, with one parameter profile per model declaring its `family` and its `supported_params` (for example `effort: [low, medium, high, xhigh, max]`, or `effort: []` when the model takes none), including entries for family heads; `load_registry` shall refuse any catalog id not prefixed `claude-<family>-*`, so that a non-Anthropic id cannot enter before its own task decides how it should work. When `seldon models refresh` runs, it shall probe each model a role names with `--model <id>` and record under the lock''s `models:` the served id, `available`, and the evidence file, treating the model as `available: false` with the reason unless the served id equals the requested id exactly. If a model probe fails, then `seldon models refresh` shall not fail the family probes and shall not block writing the lock, and the day''s cache shall not cover a named model the lock has never probed.'
  statement_check: passed
