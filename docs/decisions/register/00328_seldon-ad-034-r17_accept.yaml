statement: A declared gate that could not run (a requires tool absent from its PATH, the shell's 126 or 127, a usage error, python's No module named for its module, or a declared unrunnable_exits code) shall be `gate_unrunnable`, blocking the task merge_blocked, opening a huddle with reason gate_unrunnable naming the tools, command and tip, restoring the ledger as the branch had it and committing no record; a session's classification of its own failures as environmental shall never be read.
