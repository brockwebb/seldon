statement: '**AD-030-R14.** A Document node and a decision record are distinct node kinds joined by `seldon_artifact_id`. Existing ArchitecturalDecision and DesignNote nodes (30) are not mutated and not re-minted. From AD-030 forward, no new ArchitecturalDecision or DesignNote node is created for a governed file: the Document node plus its Ruling nodes is the decision record. `seldon docs check` counts Documents whose path is under `docs/design/` alongside legacy decision nodes. Settles ingest RESULT F6.'
