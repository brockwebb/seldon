statement: The dispatcher's spend ceiling for a dispatched session shall be the larger of the task's estimate and the measured floor, multiplied by spend_ceiling_factor, where the floor is the median token reading at the first inspection over the repository's last floor_launches finished launches, and a session_stop whose binding term is the floor shall record that floor.
