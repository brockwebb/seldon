changes:
  statement: Document identity shall be defined as the content hash rather than the file path. Governed authored documents shall remain in place, with the path serving as the edit surface, because relocation breaks re-sync. Source documents such as PDFs, harvested pages, and thread exports shall be treated as immutable, may reside at any location, and shall be resolved by hash. Git shall hold governed markdown and shall not hold source blobs. Source blobs shall be stored in a content-addressed store outside the repository, with DVC and git-annex to be evaluated as options using a plain folder as a remote before writing a custom mover.
