reason: 'SEL-062 (REVIEW-001 F-22): a failed mint''s stderr text never reaches the committed record'
changes:
  statement: With `dispatch.hive.mint_command`, the dispatcher (the pass in place, the supervisor for a worktree task) runs it once per launch, outside the session, and puts the token it prints only in the session's environment as `HIVE_TOKEN` with `HIVE_PROJECT` and `HIVE_TASK`; `session_identity` records the identity's name and a 12-character sha256 prefix of the token, never the token; a failed mint is recorded by its exit and its stderr's length and 12-character sha256 prefix, never the stderr's text, which goes to the dispatcher's own stderr only; the session launches without a token; `dispatch.hive.notices_hook` is placed on every launch line as a PostToolUse hook; an inherited `HIVE_TOKEN` never reaches a session
