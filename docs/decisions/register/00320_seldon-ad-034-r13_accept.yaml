  text: '- **AD-034-R13. The merge round''s dirt check, and every other caller of `dirty_paths`, shall count as clean an untracked symlink whose own path is ignored when its trailing slash is disregarded, or whose target is inside the primary checkout at a path the primary ignores. A directory the session made counts as clean only when it holds nothing but such links. A merged finish shall record these links as `merge.linked_by_session`. A symlink at a tracked path is a type change and still blocks.**'
