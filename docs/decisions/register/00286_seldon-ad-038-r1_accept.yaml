statement: '- **AD-038-R1. The dispatcher reconciles before it judges.** Before c7 is evaluated, the lease holder commits every dirty path that is machine-written governed state: the event store, the decision register and REGISTER.md, the prior-art query log and verdict ledger, the cadence, registered task files and their addenda. The commit is path-scoped and runs the hooks (R11 kept). The actor allowlist is removed; what qualifies a file is its path class and that its change is append-only or a registration output, never who wrote it. c7 then refuses only on dirt the reconciler could not or may not commit (a source file, a non-append-only ledger change, a hook refusal), and the refusal names that path. **Basis:** OpenGitOps principle 4; measured (797 refusals, all machine dirt).'
