statement: '- **AD-038-R3. The MCP server runs HEAD.** Every mutating seldon-mcp tool runs its command in a fresh subprocess (`python -m seldon ...` from the repository''s interpreter) and relays the result; read-only tools may stay in process. `loaded_state.stale` then guards only the read-only tools and never asks for a restart. **Basis:** `importlib.reload` caveats; measured (this session lost every tool at 01:37Z when DESK-002R merged, the third restart in three days).'
