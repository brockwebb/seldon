  text: '- **AD-034-R7. Append-only files merge by union, and the merged content is checked before main moves.** `.gitattributes` marks them `merge=union`, and that attribute is the only list: the files git merges by union are the files the check reads. Each line the merge added (lines already on main are not the task''s) must parse as a JSON object, and its `dispatch.union_unique_key` (default `event_id`) must not repeat a key already in the file; a failure is `merge_blocked` with reason `union_invalid`.'
