statement: '**AD-030-R21.** Supersession is declared, not inferred. A ruling that replaces another carries the declaration as its final sentence in the form `Supersedes AD-NNN-Rn.` (hyphenated ruling ID, sentence-final). Recovery is a single pattern over ruling text: `Supersedes` followed by one or more ruling IDs. Whole-document supersession uses a `Supersedes:` header field with document names. Nothing else is read as supersession. Settles reconcile RESULT G6.'
