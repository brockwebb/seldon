reason: 'SEL-062 (REVIEW-001 F-16, F-21): R41 is a guard on the transition into completed, and the branch must be on main'
changes:
  statement: 'A ResearchTask the dispatcher blocked (blocked now, or blocked after its newest launch) moves into `completed` only through a guard on that transition, met by every path (`seldon cc complete` and the MCP `seldon_cc_complete`, `seldon task close` and `seldon_task_close`, `seldon task update`, any walk): it passes on a passing, clean, full `gate_run` record of the tree the dispatch branch holds at that moment (a scheduled run, `seldon gate main`, or a full `seldon gate run` there) when the task''s own dispatch branch on record has every commit''s patch on that branch (`git cherry`), and records that record''s id on the task as `completion_gate`; otherwise it refuses as `blocked_ungated` (no evidence) or `branch_not_on_main` (naming the branch and its unmerged commits) and writes nothing. The dispatcher''s own completion after a merge passes with that merge''s R26 evidence. The operator''s `seldon cc complete --ungated "<reason>"` completes it anyway and records the reason on the task as `completed_ungated`. A project with no dispatch block has no gate to require'
