statement: '**AD-030-R11.** The R9 design-note gate binds every actor except `cc`. Exemption is an allow-list of one, not a deny-list. A task created by any actor string other than `cc` (`desktop`, an autonomous agent, an unknown value) is gated. Settles handoff RESULT F1. Rationale: CC executes decisions; anything else that files a task is deciding, and unknown actors escaping a gate silently is the failure mode AD-030 section 2 describes.'
