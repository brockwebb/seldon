changes:
  statement: Every job and scheduled lane shall carry a cost estimate and shall spend through reserve-then-settle via one metered chokepoint. If actual spend is at or under 10% over the estimate, then the job shall run and log the spend. If actual spend is from 10% up to 20% over the estimate, then the system shall raise a warning event. If actual spend exceeds 20% over the estimate, then the job shall stop before spending and shall require the operator's dated approval to proceed. The system shall record and chart estimate versus actual spend for every job. Large corpora shall run in rate-limited lots sized to what the budget can absorb, and nightly and weekly maintenance lanes shall each carry their own estimates.
  statement_check: passed
