  text: '- **AD-034-R9. A worktree task whose supervisor is gone is blocked by the next pass, and its worktree and lease are kept.** The pass reads each per-worktree lease. Once the supervisor has taken its flock, liveness is the flock, which the kernel drops at death and which is immune to PID reuse; before that it is the PID the pass recorded. A dead holder, or a lease released while its task is still `in_progress`, moves the task to `blocked` with `dispatch_finished.outcome` `holder_gone` or `released_unfinished`, terminates the process group the supervisor recorded so an orphaned session stops writing and spending, and notifies. The lease file stays for `seldon dispatch lease reap --task <stem>`, which refuses a live holder; nothing is reaped by age.'
