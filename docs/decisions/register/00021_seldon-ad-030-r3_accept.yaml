statement: '**AD-030-R3.** Ingest runs on commit, not on cron. `seldon verify --fix` (already pre-commit) parses governed files through the Squiddy recipe. A periodic currency sweep is the backstop for anything that bypassed the hook, never the primary path. Rationale: the defect window is the gap between a ruling being written and the next task being registered; a daily sweep leaves that window open.'
