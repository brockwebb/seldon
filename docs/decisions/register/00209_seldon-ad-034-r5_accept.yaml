  text: '- **AD-034-R5. A worktree task merges on green and is never resolved by the dispatcher.** When the session exits 0 with its RESULT committed on its branch, the supervisor requires a clean worktree, rebases onto main, reruns `dispatch.gate_command` in the worktree when main changed a file in the task''s write set (`merge=union` files excepted), checks every `merge=union` file the task wrote, checks the task''s spec against its registered hash, then under the pass lease commits any pending record and shared-file lines and fast-forwards main only if main has not moved. A move made only of `merge=union` and `shared_paths` commits is rebased over inside the lease, since it cannot conflict and never triggers a re-gate; any other move, a refused fast-forward or a primary off its branch ends the round, up to `merge_attempts`. A rebase conflict, a red re-gate, an invalid union file, a modified spec, a refused fast-forward or a main that kept moving is `merge_blocked`: the task moves to `blocked`, `dispatch_merge: merge_blocked` is set, an Issue of type `merge_blocked` names the files and links `remediated_by` to the task, the operator is notified, and the worktree and branch stay as the session left them.'
