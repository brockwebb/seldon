statement: '**AD-030-R16.** A Ruling is a section whose heading or first token carries a ruling identifier (`AD-NNN-Rn`, `DN-…-Rn`, a numbered requirement ID) or the `BINDING` banner as a heading token. Deontic words in body prose (`never`, `must`, `BINDING` used as vocabulary) do not classify. The pattern edit lives in `governed/config.yaml` under `domain:`; `matched_pattern` on each Ruling makes the reclassification auditable. Settles ingest RESULT F9. The 168 figure is a pattern count, not a ruling count, and is re-registered after the edit.'
