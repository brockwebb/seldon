reason: 'Lesson of seldon:AD-032-FC-26 (QC-001 Part C.5). Defect of record: squiddy DN-022 §1, 2026-09-29: ABBA and replicate kappa reported as judge calibration; neither measures self-preference. Closed as a mechanism: seldon qc calibrate-judge and seldon.models.resolve_judge (AD-037-R5), tested in tests/test_qc_calibrate_judge.py. AD-033-R3 has no lesson kind, so the record is a requirement with its consumer.'
kind: requirement
status: accepted
statement: '- squiddy `docs/design/2026-09-29_kill_stands_postmortem_before_any_lift.md` (DN-022) section 1: judge calibrated with ABBA 26 of 26 and replicate kappa 0.874 (scores) and 0.822 (preferences). **Correction recorded here:** ABBA counterbalancing measures position (order) bias and replicate kappa measures test-retest reliability. Neither measures self-preference. DN-022 itself notes the declared self-preference risk would have favoured arm T and T lost, so the bias did not flip that verdict; its size on this portfolio''s work is unmeasured.'
