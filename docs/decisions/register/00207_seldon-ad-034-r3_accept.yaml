  text: '- **AD-034-R3. A non-exclusive task runs in its own worktree; an exclusive task runs in place, alone, as before.** Under `max_parallel > 1` a non-exclusive task is claimed, its claim committed to main, and `git worktree add <worktree_dir>/<stem> -b <branch_prefix><stem> <main HEAD>` cut, with a detached supervisor running the session there. An exclusive task runs in the primary checkout with the pass lease held for its whole run, through the same code a serial pass uses. `max_parallel` defaults to 1, and at 1 the pass is the pre-SEL-004 pass, held byte for byte against a recorded transcript.'
