  text: '- **AD-034-R2. The planner launches a non-exclusive task only when its Touches is disjoint from everything running or waiting ahead of it.** Candidates are taken in FIFO order by `created_at`. Two declarations overlap when they share a resource name or when any two of their path globs, including each resource''s configured paths, may match one path. The glob test is sound and deliberately not exact: globs are normalised (`//` and `.` segments collapsed, lower-cased because the default macOS file system is case-insensitive), two globs are disjoint only when their literal prefixes, or their literal suffixes, are unrelated, and a literal path against a glob is decided by `fnmatch`. A task deferred for any reason reserves what it declared, so a later overlapping task cannot overtake it. An exclusive task launches only when nothing runs, and while it waits it holds everything (writer preference). `dispatch.max_parallel` caps the running set.'
