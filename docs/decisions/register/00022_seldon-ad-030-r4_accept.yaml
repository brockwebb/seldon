statement: '**AD-030-R4.** Identity is the content hash, never the path. Governed authored documents stay in place (the path is the edit surface; relocation breaks re-sync). Source documents (PDFs, harvested pages, thread exports) are immutable, may live anywhere, and are resolved by hash. Git holds governed markdown; it does not hold source blobs. Source blobs go to a content-addressed store outside the repository (evaluate DVC and git-annex before writing a mover; both use a plain folder as a remote).'
