  text: '- **AD-034-R1. Independence is declared per task, by resource, and the scheduler never infers it.** A task file may carry `**Exclusive:** yes|no` (absent means yes) and `**Touches:** <item>, ...`, where an item is a resource named under `dispatch.resources` in seldon.yaml or a repository-relative path glob, or `none`. A bare word must be a configured resource name, so a typo refuses instead of silently overlapping nothing. `Exclusive: no` requires `Touches`. A declaration that does not parse fails criterion c10 as `concurrency_undeclared`, with the grammar quoted, in serial mode as well as parallel. A header counts only at the start of a line, so a task that quotes the grammar in prose declares nothing. A task with neither header gets no c10 and behaves exactly as before.'
