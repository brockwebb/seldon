  statement: During task registration, the registration process shall retrieve rulings relevant to the task's text regardless of whether the task cites them. If Phase 1 earns it, the registration process shall send the top-k candidate rulings to a validator call that is separate from the author, and the validator shall return a verdict of constrains, conflicts, or unrelated for each ruling along with the ruling's located receipt. If the validator returns a conflicts verdict, then the registration process shall refuse registration unless the task names the ruling and supersedes it via AD-030 R5's path. If the validator returns a constrains verdict, the registration process shall write constrained_by edges.
