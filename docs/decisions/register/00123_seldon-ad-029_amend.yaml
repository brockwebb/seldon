changes:
  statement: 'The seldon domain model shall define `precedes` as a many-to-many relationship type from ResearchTask to ResearchTask, with an optional `reason` property and an inverse read-name `preceded_by` that is never written as an edge; `DomainConfig` shall reject any configuration in which a declared inverse name is also declared as a relationship type. The system shall store `precedes` edges in one direction only. `RelationshipConfig` shall support `cardinality`, `inverse`, and `properties` fields, and edge property validation shall be opt-in: a relationship type declaring no property schema shall accept any properties, while a type declaring a schema shall have its properties validated against that schema. The seldon.core.artifacts.create_link function shall enforce, before appending any event, that the `precedes` subgraph has no self-loop and no cycle, rejecting a write that would create either; on rejection of a cycle, the system shall report the shortest path that would close the cycle. All write paths that create `precedes` edges, including `seldon task precede`, `seldon task chain`, the three MCP tools, and `seldon link create`, shall route through this gate. The `seldon task chain` command shall write a given sequence of consecutive task pairs as a single all-or-nothing operation, validating each pair against the existing graph plus prior pairs in the same call before any write occurs, and shall skip an edge that already exists rather than duplicate it. A predecessor ResearchTask shall be considered satisfied when its state is `completed`, `verified`, `superseded`, or `withdrawn`, and shall be considered not satisfied when its state is `rejected` or when its node is missing; `seldon verify` shall report a missing predecessor endpoint as a separate dangling-endpoint finding. Enforcement of `precedes` shall be advisory only: `seldon go` and `task list` shall treat it as advisory, and a state transition moving a successor ResearchTask to `accepted` or `in_progress` while it has an unsatisfied predecessor shall emit one warning line and shall proceed with the transition. The `transition_task` function shall compute this warning from the graph state as it stood before the write and return it to the caller, with the CLI printing it to stderr and the MCP tools appending it to their returned text; `walk_to_completed` shall accept an `on_warning` callback rather than returning a second value. The system shall provide a single `precedence_view()` computation that assembles precedence pairs, states, a `waits_on` map, a ready list, and chains in one pass, and `seldon task list`, `seldon_task_list`, `seldon briefing`, and `seldon go` shall all read readiness and chain data from this single computation. The `task list` command shall display a `WAITS_ON` column and mark as ready, with a `▸` marker, any open task with no unsatisfied predecessor. The `seldon go` and `seldon_go` commands shall render a ''Next ready'' list in creation order and a ''Chains'' list immediately after open tasks. A chain shall be defined as a weakly connected component of the `precedes` subgraph; a component of a single node shall not be rendered as a chain; a component forming a simple path shall render as `A → B → C`; a branching component shall not render as a single line and shall instead list its edges one per line. The `seldon verify` command shall include a Precedence check that fails when the `precedes` subgraph contains a cycle, a self-loop, or an edge whose endpoint is missing or is not a ResearchTask; this check is not Tier A, and default `seldon verify` shall exit with status 2 when this check fails. Cycle and self-loop detection for `precedes` shall run against the Neo4j graph projection rather than by replaying the event log.'
  statement_check: passed
