statement: '**AD-030-R12.** Manifest state for a governed document is a projection of the kit''s stage axis, not a fifth state machine. `cataloged` and `held` map one to one; `admitting` and `in_graph` both render as `admitted`; any `excluded:` disposition renders as `declined`. The kit''s in-flight stage is never exposed. Settles ingest RESULT F4. AD-030 R5 stands; this ruling defines its mapping.'
