statement: '- **AD-036-R9. A test never spends unasked.** arnold''s live seed-scan test calls a model whenever `claude` is on PATH. Any test that can reach a model launcher without a fake runs only under an explicit opt-in variable named in its skip reason, in every repository MODEL-001 touched. A PATH shim that records invocations proves zero calls by default.'
