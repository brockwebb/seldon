changes:
  statement: When `seldon prior-art verify <note>` is run, the seldon tool shall re-run each library query against the named release and each internal query against the named commit, and shall pass a receipt only when the cited ids or lines are in the result. If a named release or commit is no longer loadable, then the tool shall fail that receipt with `release_unavailable`, naming the release or commit. The tool shall record the verification once, at commit (R4), so that a later library rebuild does not orphan an accepted note.
