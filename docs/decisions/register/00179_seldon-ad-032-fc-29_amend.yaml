changes:
  statement: 'While a line stop occurs, the line stop process shall run one huddle consisting of: (1) an incident record containing the reading, the specification, and receipts; (2) assignable-cause analysis conducted under FC-09, reading one level down and asking why until the cause is identified as a mechanism; (3) a fix of the root cause; (4) recording the fix as a gate under FC-26, with a planted control that fails on the old code; and (5) resuming by re-running the same command. The huddle process shall ensure that resume restores authorization and never widens it. The huddle process shall not permit an incident to close without a linked gate id and its control run. The huddle process shall count a recurrence of a closed incident''s class in FC-31''s recurrence measure.'
