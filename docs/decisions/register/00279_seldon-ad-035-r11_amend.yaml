changes:
  statement: 'The registry shall check each role''s declared parameters against its model''s `supported_params` at load, and shall refuse at load, naming the role, the parameter and the model, any parameter the model does not support or any value it does not take, because a parameter must never be silently dropped at launch. The launcher shall pass exactly the declared, supported parameters, so a model whose profile is `effort: []` launches with no `--effort` flag and no `CLAUDE_CODE_EFFORT_LEVEL`, while AD-036-R8 holds for every model whose profile has effort levels, the role naming one. A family role shall be checked at load against the head the documented-default table was read for, and checked again at resolution against the head the lock serves when the catalog has that head; a bump to a head with no profile shall be named `profile_missing` in the `models_lock_bumped` event.'
