  statement: The internal search tool shall be subject to a pre-registered recall control whose positive set is the 18 known-relevant locations (the 14 file:line entries of G5 problem 1's timeline plus the four ai-readiness-kg §1 and §7 lines cited in section 2), queried with one query per entry that is fixed before the run and written from the entry's topic, never from its wording; the tool passes when the Wilson-95 lower bound of recall at top 20 is at or above 0.70, and the control shall be re-run on every change to the tool. If the tool fails the control, then the failure shall be reported with the misses, shall not block R4 (because the gate checks presence and verifiability, not search quality), and shall open a design task for the governed-graph arm.
