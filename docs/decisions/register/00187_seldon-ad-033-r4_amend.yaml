  statement: The decision register shall use a lifecycle status model with values proposed, accepted, rejected, deprecated, and superseded, where a record never changes after it is written, a status change is recorded as a new transition record, and a superseded status is derived from the later record that names it. Only accepted records bind. Desktop decisions under L4 shall be accepted when registered with decided_by desktop, and the operator shall override such a decision only by a superseding record, never by an edit. Where a decision waits on a named measurement, the record shall use status proposed and shall name that measurement.
