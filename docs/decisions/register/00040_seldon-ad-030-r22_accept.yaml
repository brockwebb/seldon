statement: '**AD-030-R22.** An admitted governed document whose content hash has moved is re-ingested at the cost of that one document. The requirement is on the stream Seldon consumes (AD-030-R10): the kit''s assess stage compares the manifest''s recorded hash against the file, treats `admitted but changed` as admissible, and the write stage appends updated node events that the projection merges last-write-wins. A full ledger rewrite is a reset path, never the edit path. Until this lands, no corpus larger than the Seldon repo is admitted. Settles reconcile RESULT G9.'
