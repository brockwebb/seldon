  statement: 'Every new design note shall carry a `## Prior art` section with two subsections, `### External` and `### Internal`, in which each entry is a receipt: a library receipt names the query string, the index release and its sha256, and one or more returned row ids; an internal receipt names the query string, the repository and its commit sha, and file:line hits; a web receipt names the URL and the retrieval date and is allowed only in External, and an External section containing only web receipts shall also carry at least one library query, even one that found nothing; a finding of "no prior art" shall be recorded as a receipt of the query that found nothing and never as a sentence.'
