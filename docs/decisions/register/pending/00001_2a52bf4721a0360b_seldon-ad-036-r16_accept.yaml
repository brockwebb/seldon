statement: A task that answers a filing from another repository shall carry `**Answers:** <repo>:<ref>`, and registration shall refuse one that does not resolve to exactly one task in that repository's graph (`answers_unresolved`); `seldon cc complete` shall refuse the task (`return_unfiled`) until a return task naming it in its `**Returns:**` header is registered in the consumer's graph and committed in the consumer's repository; `seldon cc return` shall write that return from the RESULT's `For <repo>` section, numbered by the consumer's allocator, `After:` the consumer's latest open task, and register it there (AD-036-R12); the dispatcher's merged finish shall run the same writer when the session did not, push the consumer, and block rather than complete a task whose return cannot be filed.
