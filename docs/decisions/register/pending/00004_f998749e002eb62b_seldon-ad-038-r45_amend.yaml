changes:
  statement: 'Every limit the launch line sets is tried by planted requests before any launch when the limits'' fingerprint is new or the last try could not run, and by `seldon dispatch controls`, which writes the state a pass reads: each guarded path by a planted `Read`, a planted `Bash cat`, a `cd` to its parent with a relative `cat`, a quote-split `cat` and a `Grep` rooted at its parent, all fed to the installed hook command; the spend ceiling by the inspector over a planted session at twice its ceiling; the fingerprint covers the launch line''s hook command, the guarded paths, the spend factor and a sha256 of the code that enforces them (`controls.py`, `dispatch_stations.py`, `stations.py`); one `limits_tried` per fingerprint and outcome; a limit that lets its plant through refuses every launch (`limit_control_failed`, a standing condition in the stuck streak) until the limits change and hold; a plant the harness could not run (an `OSError` or a timeout) is untried, not failed: it refuses the pass it happens on as `limit_control_untried` and is tried again on the next'
