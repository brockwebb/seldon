reason: 'SEL-063 (REVIEW-001 F-32): hooks status judges a checkout by its own config.worktree; the shared value is advisory'
changes:
  statement: '`seldon hooks install` writes the shared `core.hooksPath` as the main worktree''s `.githooks`, absolute, and the checkout''s own `config.worktree` as the relative `.githooks`, with `extensions.worktreeConfig` on; `seldon hooks status` calls a checkout installed by its own `config.worktree` alone, and reports a shared value other than the one install writes as an advisory, never as not installed; a checkout whose own `config.worktree` does not name `.githooks` is reported as not installed'
