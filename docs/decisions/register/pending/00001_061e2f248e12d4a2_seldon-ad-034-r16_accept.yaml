statement: When a project declares dispatch.gate_record (its record command, tracked JSONL ledger, commit_field, pass_field and timeout_s, optionally requires, unrunnable_exits and tree_paths; `none` declares no ledger and an absent key keeps today's round), the merge round shall merge a tip only when the ledger the tip carries holds a pass whose named commit differs from the tip, under tree_paths or the whole tree, only in the ledger and the round's housekeeping, the newest covering line deciding; with none it shall run the command in the worktree under the declared interpreter outside the pass lease, commit the appended line on the branch and check again, and block merge_blocked `pass_unrecorded` naming the ledger when still uncovered, re-checking under the lease after any housekeeping rebase and recording gate_record on the merge and gate_recorded per run.
