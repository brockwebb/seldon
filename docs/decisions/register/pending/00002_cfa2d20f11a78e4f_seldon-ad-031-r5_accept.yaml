statement: 'With `recall.selection.mode: touch`, registration chooses hits in this order, each carrying one line saying why: the RESULTs, dead ends and decision records the task cites; the RESULT of the earlier task whose commits changed the files the task names or the notes it cites, most specific first, at most `max_file_hits`; Issues naming those files or cited ids, at most `max_issue_hits`; a kept or superseded task of the same code prefix in the last `dead_end_days` that shares a file or enough terms, with its reason; then lexical hits only of kinds whose `lexical_min_shared_terms` is set and only above it. A citation in more than `max_citing_share` of the repository''s task files is the template''s and is not a reason; a file more than `max_tasks_per_file` tasks changed is not either. The list may be shorter than `top_n`, or empty; the served arm is not run'
