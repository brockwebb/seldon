reason: 'SEL-062 (REVIEW-001 F-19): a pass record scoped by tree_paths neither stands under the closure nor ends it'
changes:
  statement: 'While the newest scheduled run is red, the project''s merges are closed to every change that can change a test''s outcome, and the dispatcher says so: the red run rings `dispatch.notify` once and opens one Issue (`main_red`). Under closure the merge round''s plans (re-gate and evidence gate) also run the test files the red run failed, and a red run that named none (a timeout, unparsed output) makes them full; a plan that selects nothing, because every changed path matched a slice declared `tests: none`, is not closed. Evidence that skipped the closure is not evidence under R26 while it holds, and a declared pass record scoped by `tree_paths` is such evidence. The closure ends when a later scheduled run passes, or when a branch merges on a passing full gate of its tip, of which a pass record counts only when it covers the whole tree; after any merge under closure the scheduled run is due on the next pass'
