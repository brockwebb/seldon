  text: '- **AD-034-R14. When the dispatcher names a worktree whose checkout carries `.githooks/pre-commit`, it shall turn on `extensions.worktreeConfig` and set that worktree''s own `core.hooksPath` to the relative `.githooks` (`git config --worktree`). It shall never write the primary''s value, and it shall record the reading on `dispatch_worktree_named.hooks_path`. The dispatcher shall refuse, and record the refusal, when the shared config sets `core.worktree` or `core.bare = true`.**'
