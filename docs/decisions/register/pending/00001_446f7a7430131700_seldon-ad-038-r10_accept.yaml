statement: 'The dispatcher shall hold a task whose precedes predecessor is completed or verified (criterion c18, `ooda_pending`) until an `ooda_recorded` event names that predecessor, or its committed `<stem>_OODA.md` exists, or `dispatch.ooda_grace_s` seconds have passed since its last completion (ledger, else graph updated_at; neither: hold until a record); a grace of 0, the default, never waits and leaves c18 absent; above 0, c18 is present for every task it applies to and records released_by; superseded, withdrawn or rejected predecessors hold nothing; the reconciler shall commit an untracked `_OODA.md` beside a registered task.'
