statement: The dispatcher shall hold a candidate with an unsatisfied cross-project wait (criterion c17, `waits_on_unsatisfied`) or one whose other graph cannot be read (`waits_on_unreachable`, logged), c17 being absent unless it fails; it shall redrive to accepted a declared block (no dispatcher claim) on a task whose cross-project waits are all satisfied, recording dispatch_redrive with stop_reason waits_on_satisfied, and shall not so redrive a session it halted; `seldon verify` shall fail a wait whose target no longer resolves and warn on a reasonless block, a wait on a superseded, withdrawn or rejected target, and a wait whose graph cannot be read.
