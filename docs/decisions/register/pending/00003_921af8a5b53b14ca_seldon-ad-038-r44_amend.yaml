  statement: 'The session guard: the PreToolUse tool gate refuses a tool call that names a path under `dispatch.guard.deny_paths` or `dispatch.hive.secrets_dir` in any of the spellings it resolves: a file tool''s path argument resolved against the call''s working directory; a search tool (Grep, Glob, LS) whose root, or an absolute Glob pattern''s literal prefix, is the guarded directory or a parent of it; and a Bash command''s words after shell quoting is removed (`shlex`), with `~` and environment variables expanded and each relative word resolved against the working directory as the command''s own `cd`s change it, the text after a `--flag=`, and the raw text in the `~`, `$HOME` and `/private` spellings; it runs before the tool gate reads the event store, and the paths ride on the hook''s own command line (`--deny-path`)'
