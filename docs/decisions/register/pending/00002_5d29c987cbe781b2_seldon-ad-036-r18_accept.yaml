statement: An **Answers:** header naming the answering repository itself shall resolve the ref in its own graph, refuse a ref that is not a filing or a filing with no consumer (Filed by, or --to), number the return by the consumer's most common prefix unless --prefix names one, and walk the filing to completed once the return is registered and committed in the consumer; seldon cc return --answers shall supply the value for an answering task whose file carries no header, and refuse one that differs from the file's header.
