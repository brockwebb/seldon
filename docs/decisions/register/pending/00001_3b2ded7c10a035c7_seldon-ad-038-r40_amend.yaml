reason: 'SEL-062 (REVIEW-001 F-09, F-10, F-11): a lane task holds and waits on its writes; no scheduled gate beside a lane session; membership by name is not attested'
changes:
  statement: 'A project may declare one coordination lane, `dispatch.coordination_lane: {name_pattern, slots, writes, merge_wait_s}`: a task whose graph name matches `name_pattern` goes first among eligible candidates, always runs in its own worktree under its own supervisor, takes one of `slots` reserved slots and no `max_parallel` slot, and is neither held back by an exclusive task, running or waiting, nor holds one back; its lane''s `writes` are its declaration for every other hold, so it waits on a running or waiting non-exclusive task whose declaration overlaps them and, running, holds them; while an exclusive task runs, its holder looks for a lane task at each inspection tick and launches it under the pass lease it already holds; no scheduled full gate starts while a lane session is in flight'
