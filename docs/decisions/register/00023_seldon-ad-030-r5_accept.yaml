statement: '**AD-030-R5.** The manifest lives in the graph. Every document ever considered is a Document node from the moment it is cataloged, with states `cataloged -> held -> admitted | declined`. Declined nodes carry `reason`, `date`, `decided_by` and never receive content edges. The YAML manifest is rendered from these nodes and is never hand-edited. Reopening a declined document requires a new decision node with a `supersedes` edge citing new evidence. The admission invariant becomes one query: no content edge without an `admitted` Document node.'
