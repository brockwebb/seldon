  text: '- **AD-034-R8. A file that must be one file across worktrees resolves to the primary checkout and is appended under its own flock.** A worktree session resolves such a file (a spend ledger) with `seldon.core.worktree.primary_checkout`, or `$SELDON_PRIMARY_CHECKOUT`, and appends under `seldon.core.worktree.locked`, the flock discipline `kg/spend.py` already uses, so parallel runs share one daily cap. A file listed in `dispatch.shared_paths` is committed by the pass under that flock when it is append-only against HEAD, and its appends are not dirt that c7 waits on.'
