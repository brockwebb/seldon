changes:
  statement: The CC4 dashboard and SQLite metrics store shall serve as the reference implementation of the observability substrate for Seldon, Wintermute, and related infrastructure, using an insert-only schema with dot-notation metric names, JSON dimensions, and versioning by collected_by. When adjacent or future observability work is undertaken, it shall extend the CC4 metrics store rather than build parallel stores. Every gate, sleep function, and pipeline step that claims value shall emit events to the substrate. A new Seldon or Wintermute component shall not be considered complete unless it emits appropriate events to the substrate, as a definition-of-done criterion. When substrate data is available, decisions about component retention, deprecation, and calibration — including whether a gate is catching violations, whether a function is producing signal, or whether a pipeline is used — shall be made against that substrate data rather than qualitative recall.
