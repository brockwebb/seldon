reason: 'SEL-062 (REVIEW-001 F-18, F-12): status shows the newest full gate''s age; the pass''s call never raises'
changes:
  statement: 'Where a project declares slices, its full suite runs on main on a schedule, not on a task''s change: the dispatcher''s pass runs `dispatch.gate_command` in a detached checkout of main''s head (call site `scheduled`, one `gate_run` record) when `dispatch.gate.full_every_s` has passed since the newest full gate on record, on a pass with no session in flight and nothing eligible to launch, and before a launch once `dispatch.gate.full_overdue_s` has passed; `seldon gate main` runs it by hand; `seldon dispatch status` shows the newest full gate''s time and age against both thresholds; the pass''s call never raises, and an error other than a busy checkout or a configuration error is recorded as `gate_scheduled_error` and printed. The cadence never promotes a task''s gate'
  consumer:
