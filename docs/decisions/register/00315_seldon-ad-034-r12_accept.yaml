  text: '- **AD-034-R12. At launch the dispatcher reads the task''s `**Repo:**` line for the other repositories its L4 clause says to push, and records each one''s HEAD on `dispatch_launched`. At a merged finish it pushes main in each of them whose HEAD moved during the session, whose current branch is `dispatch.cross_repo_branch` and whose tree is clean. It records each repository''s reading on `dispatch_finished.push_repos`. A refusal (a dirty tree, another branch, no upstream, a failed push, a missing checkout) raises one alarm through the notify channel, naming every refused repository. An unmerged finish pushes nothing elsewhere and records `held_unmerged` for each repository that moved.**'
