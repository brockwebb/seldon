statement: '**AD-030-R10.** Seldon depends on Squiddy; Squiddy has no knowledge of Seldon. The coupling is a stream specification, not awareness: Seldon supplies a domain schema (LinkML) and a manifest entry pointing at a file; Squiddy returns ledger events and store nodes conforming to that schema, each event stamped with the schema version. The dependency is pinned in `pyproject.toml`; CLAUDE.md names it in one line and carries no contract. The dependency graph stays acyclic. Rationale: Wintermute''s ingest became a monolith when it knew its callers.'
