statement: Task-file headers shall be read from the header block only (after the title, up to the first `##` heading or thematic break, fences excluded; header lines start with a bold label; fields in code spans are not read), and `static_checks` shall refuse `header_repeated:<name>` for any header it reads that the block carries twice, at registration and at the dispatcher.
