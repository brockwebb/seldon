statement: '**AD-030-R13.** `mentions` edges are emitted only where the target resolves inside the emitting graph. Every other identifier a document references is carried on the node as `identifiers` and resolved by the consuming graph against its own artifacts. Identifiers that resolve nowhere are abstained on and reported by `seldon governed status`, never emitted as dangling edges. Settles ingest RESULT F5 and supersedes the "for every identifier" wording in AD-030 section 4. This is R10 applied to link recovery.'
