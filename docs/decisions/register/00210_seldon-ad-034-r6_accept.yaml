  text: '- **AD-034-R6. The dispatcher, not the session, completes a worktree task, and only after main carries its work.** The worktree prompt tells the session not to run `seldon cc complete`, merge, push or switch branches. After the fast-forward the supervisor walks the task to `completed` with `dispatch_merge: merged`, writes `dispatch_finished` with `outcome: merged`, pushes and removes the worktree. The graph never says `completed` for work that is not on main, so a successor''s c2 cannot open on an unmerged predecessor.'
