statement: '**AD-030-R20.** A governed document declares its canonical name in a `Name:` header field. The name is the graph identity used by `name`-keyed queries, `EXTENDS` recovery and the ruling ID prefix. When the field is absent, the derivation is the leading identifier of the file stem, with sorted-path-first-claim as the collision tiebreak; a derived name is never authoritative over a declared one. Every design note written from this ruling forward carries the field. Settles reconcile RESULT G2.'
