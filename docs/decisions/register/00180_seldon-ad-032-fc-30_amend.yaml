changes:
  statement: The board shall be its own component with its own repository and store, separate from other components. Agents shall post to the board through one write path that emits an envelope-v2 event carrying the same provenance a graph write carries. Orchestrators shall read the board at task authoring, and task agents shall read the board through a read verb. The board shall require each entry to hold an entry id that is content-addressed, an author agent field identifying agent id, model, and session, a project field identifying the repository, a problem label drawn from a controlled list seeded with the 143 recurrence labels, a claim expressed as one stand-alone statement, evidence receipts expressed as ids in an evidence store, a status of proposed, confirmed by reuse, superseded, or retracted, and links expressing supersedes and reused-by relationships. If a post is planted without an author or project, then the board shall refuse it. The board shall ensure that every evidence receipt on a confirmed post resolves in an evidence store.
