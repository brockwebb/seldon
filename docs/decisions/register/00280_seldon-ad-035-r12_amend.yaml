  statement: If the model named by a role is unavailable, then the role resolver shall fail the role as `model_unavailable` and shall never fall back to another model, because that is the substitution R6 exists to stop. R5 shall accept the family heads plus every named model the lock marks available, and shall refuse a `**Model:** <role>` header naming an unavailable model, quoting the lock. The four `ANTHROPIC_DEFAULT_*_MODEL` variables shall still carry the family heads, `--model` shall carry the named id, and the R6 receipt shall compare the served id with that named id. AD-037's checker over a role naming a model shall map by that model's catalog family (an opus model is read by fable), and a calibration report shall stay per judge id over generator id; AD-037 governs both, nothing in it changes, and the base task's R13 is not a ruling here.
