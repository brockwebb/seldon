statement: '**AD-030-R15.** A citation is captured only when the reference carries a year, a DOI, or `et al.`; a bare name is a `mentions` candidate, not a Citation. Design notes therefore write every prior-art entry with at least a year. AD-030 section 6 entries lacking a year (INCOSE/SysML v2, DOORS/ReqIF, PROV-O, OpenCitations, ODK/ROBOT) are corrected in the next design note that cites them, not by editing AD-030. Settles ingest RESULT F8 and extends R9.'
