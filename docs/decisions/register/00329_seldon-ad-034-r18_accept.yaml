statement: The declared gate command shall never run while the pass holds the project's filing lock; the pass's re-merge and regate shall read the ledger only and, for an uncovered tip with no record of that tree, leave the task as it was and write gate_record_pending; after _release_filing and before any launch the pass shall run the command for each pending task still blocked with its worktree on disk, rebased onto main, unless its tree is covered or already recorded, and the next pass merges on the record; a tree whose record ran and did not pass shall go to the round, which blocks it naming the record; the post-session round and seldon dispatch regate, holding no filing lock, run the command themselves.
