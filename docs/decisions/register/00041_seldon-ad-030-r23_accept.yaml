statement: '**AD-030-R23.** R16 governs classification only. A block admitted as a Ruling has its force (`binding`, `prohibition`, `recommendation`) read from its own text by a separate force pattern list. A ruling identifier classifies a block only when used as a label: sentence-initial and terminated by `.` or `:`, or bolded, or opening a heading. An identifier mentioned inside a sentence, or cited in a heading that discusses it, is a `mentions` target. Ratifies reconcile RESULT G7 and G8.'
