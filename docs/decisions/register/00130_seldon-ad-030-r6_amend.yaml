changes:
  statement: When a citation appears in a governed document, the ingest process shall create a Citation node in state 'proposed' for that citation, and shall create a Passage node recording the section or paragraph identifier, verbatim span, and hash of source text when a span was quoted. Verification of a Citation node shall be recorded as a state transition from 'proposed' to 'verified' carrying method, date, and by. The 'seldon verify' command shall report unverified citations in the same manner it reports unregistered numbers. Design notes shall be permitted to ship with citations in state 'proposed'. The 'seldon paper build' command shall refuse citations in state 'proposed' at Tier 1.
