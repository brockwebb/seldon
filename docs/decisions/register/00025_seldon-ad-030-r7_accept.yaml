statement: '**AD-030-R7.** Citation edges use the CiTO vocabulary, not an invented one. Fundamentals: `cites_as_evidence`, `uses_method_in`, `extends`. Constraint-driven prescriptions the operator rejects because the constraint no longer holds under current tooling: `disagrees_with` or `refutes`, with a `reason` property naming the constraint. Rejected science stays in the graph as a rejected prescription; reinstatement requires supersession with evidence. This is the queryable form of the artifact engineering standards section 7.5 already requires.'
