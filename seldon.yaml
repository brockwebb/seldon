event_store:
  path: seldon_events.jsonl
neo4j:
  database: seldon-seldon-self
  uri: bolt://localhost:7687
project:
  created_at: '2026-03-16T00:55:34.088334Z'
  domain: research
  name: seldon-self
  slug: seldon-self

handoff:
  # Session-window fallback used only when no LabNotebookEntry and no handoff
  # file exist to bound the session (`seldon handoff`, AD-030-R9).
  session_window_hours: 12
  # AD-030-R9: refuse to close a Desktop session that created tasks and wrote
  # no docs/design/ note. Set false to warn instead of refusing.
  require_design_note: true

governed:
  # AD-030: governed documents as graph content. The Squiddy graph under `governed/` parses every
  # markdown file in docs/design/, docs/requirements/, cc_tasks/ and handoffs/ into its own ledger;
  # `seldon governed sync` imports that ledger through Seldon's write path.
  graph_dir: governed
  # Minimum concept overlap before `seldon cc register` surfaces a ruling it was not told about.
  # Lower buries the identifier matches under coincidence; higher finds only rulings the task
  # already names, which the identifier pass has found already.
  ruling_match_threshold: 0.18

shared_ontology:
  # Per AD-017: Central Validity Ontology
  # Seldon repo owns the master vocabulary files.
  # ingest reads both vocabularies and writes to seldon-ontology master DB.
  # Relative to this file's directory, so every checkout and every git worktree
  # reads its OWN vocabulary tree. An absolute path here named one clone and
  # made worktree vocabulary edits untestable (defect sweep RESULT §7.6).
  source: ontology/
  vocabularies:
    - validity/VALIDITY_VOCABULARY.md
    - practitioner/PRACTITIONER_VOCABULARY.md
  inheritance: read-only

decisions:
  # AD-033: the decision register. Records are YAML files under docs/decisions/register/, one per
  # record event, written only by `seldon decision` (R2); docs/decisions/REGISTER.md is rendered.
  repository: seldon
  # Where the other registers live, for records that name them (a seldon record superseding a
  # squiddy one writes the transition into squiddy's register).
  repositories:
    squiddy: ../squiddy
    arnold: ../arnold
  # Baseline DB-1 (AD-033-R5): the main HEAD at SEL-002's start. A labeled decision in a design
  # note absent from this commit's tree must have a record (`seldon verify`).
  baseline:
    name: DB-1
    commit: a6422a0e7cfa3184ab870557c46d99d8962f9669
  design_notes:
    - glob: docs/design/AD-*.md
      pattern: '^(?:\s*[-*]\s*)?\*\*(AD-\d{3}-R\d+)[.:)\s]'
      id: '{repo}:{label}'
    - glob: docs/design/AD-*.md
      pattern: '^(?:\s*[-*]\s*)?\*\*(R\d+)[.:)\s]'
      id: '{repo}:{doc}-{label}'
    - glob: docs/design/AD-*.md
      pattern: '^\*\*(FC-\d{2})\.'
      id: '{repo}:{doc}-{label}'
    # AD-036 section 6.1: the heading form AD-035 was committed in (`## AD-035-R1. ...`). Without it
    # the register could not see AD-035's rulings and verify could not miss them.
    - glob: docs/design/AD-*.md
      pattern: '^#{2,4}\s+(AD-\d{3}-R\d+)[.:)\s]'
      id: '{repo}:{label}'
  consumer_roots: [tests, seldon]
  # AD-033-R9: the conflicts probe re-run on the register (`seldon decision check --probe`).
  probe:
    findings: ../squiddy/docs/findings/2026-10-03_operator_audit/probe/conflicts.jsonl
    exclusions: docs/decisions/probe_exclusions.yaml

prior_art:
  # AD-036: the prior-art receipts gate. `seldon prior-art search|verify` (seldon/core/prior_art.py).
  # Every query either arm runs, for a search, a verification or the recall control, is appended
  # here with the corpus identities it ran against (AD-036-R3: "a logged, deterministic tool").
  log: state/prior_art_queries.jsonl
  # AD-036-R3's declared internal corpus. Each root is searched at its HEAD commit (git objects,
  # so a receipt can be re-run at that commit) plus the files on disk the commit does not hold
  # (gitignored handoffs), which a receipt cites with their content hash.
  internal_roots:
    - {name: seldon, path: .}
    - {name: squiddy, path: ../squiddy}
    - {name: ai-readiness-kg, path: ../ai-readiness-kg}
    - {name: arnold, path: ../arnold}
    - {name: icsp_notebook, path: ../icsp_notebook}
    # Wintermute keeps its notes flat under docs/ and its handoffs at the top level.
    - name: wintermute
      path: ~/.wintermute
      include: ['docs/**', 'handoffs/**', CLAUDE.md]
    # The 2026-10-03 cross-project audit. Not a git repository, so its receipts name the digest
    # of every file searched (`workbench-audit@tree:<sha256>`).
    - name: workbench-audit
      path: ../workbench/2026-10-03_audit_and_decision_probe
      include: ['**']
  internal:
    # R3's list, plus each repository's top-level docs/*.md. Added before the recall control ran
    # (PA-001 Part C pre-registration): a repository's governing specification and decision log
    # live there (squiddy docs/EXTRACTION_DESIGN_SPEC.md, docs/DECISIONS_INHERITED.md;
    # ai-readiness-kg docs/design_decisions.md), and an internal search that skips the decision
    # log is not an internal search. Recorded in AD-036 ADDENDUM 01.
    default_include: ['docs/design/**', 'docs/research/**', 'docs/decisions/**', 'handoffs/**',
                      CLAUDE.md, DECISIONS_INHERITED.md, 'docs/*.md']
    suffixes: [.md, .markdown, .txt, .yaml, .yml]
    # How many hits a printed receipt cites per repository, and R5's "top 20".
    top_n: 20
    # A governed text over 2 MB is a data dump, not a note; skipped files are counted and printed.
    max_file_bytes: 2000000
    # BM25's textbook parameters (Robertson and Zaragoza 2009), untuned: ranking only orders the
    # print-out and R5's top 20; verification is by membership.
    bm25: {k1: 1.2, b: 0.75}
  library:
    # The squiddy library graph whose built index `search` serves (DN-025 R-110).
    graph: ../squiddy/graphs/library
    # Documents returned per library query; a receipt's rows must be among them. The served
    # verb's default is 10; 20 matches the internal arm's top 20.
    k: 20
  gate:
    # AD-036-R4: design notes under this directory need a passing verdict to be committed or to
    # govern a registered task. Addenda and errata complete or correct a note and are verified
    # WITH it (a note's addenda are read together with it), so they are not gated alone.
    design_dir: docs/design
    baseline: docs/design/AD-036_baseline.txt
    exempt_globs: ['*_ADDENDUM_*.md', '*_erratum_*.md', '*_ERRATUM_*.md']

dispatch:
  # SEL-005 (docs/design/2026-09-15_standing_dispatcher.md "Adopting it in another project";
  # ai-readiness-kg DN-006; AD-034; AD-036 section 6.2). Values and reasons copied from
  # ai-readiness-kg's block where they apply; each reason is restated here because this is the file
  # an operator reads to change it.
  #
  # THE KILL SWITCH. Read on EVERY pass, never cached; a bool, not a string. To stop the world
  # without editing this file: `touch .seldon/DISPATCH_STOP`. While it is true, the operator does
  # not hand-dispatch in this checkout (DN-006 decision 10): the dispatcher cannot see a session it
  # did not launch except through c7's clean-tree check.
  enabled: true
  # The branch a pass may dispatch on. Any other branch fails c7, together with a dirty tree.
  branch: main
  # THE STANDING BAND, as a REFERENCE and never a copied number (DN-006 section 5). SEL-005: the
  # machine-wide spend configuration of squiddy DN-042 (R-176, one ledger for the machine). Its one
  # integer token cap is R-179's `job_token_cap_default`, "the token cap of a job whose runner has
  # no cap of its own to declare", which is what a dispatched Claude Code session is. A task whose
  # `**Spend:**` declares more is not launched unattended (c4); it waits for a pasted line. The cap
  # is in weighted tokens and a Spend header in tokens: the comparison is conservative.
  standing_band_ref: ../squiddy/squiddy/spend.yaml#job_token_cap_default
  # NO MEASURED BASIS (DN-006 section 5): a pass is a local graph read at zero spend, so polling
  # often costs nearly nothing and polling rarely costs latency. ai-readiness-kg's starting value.
  # The plist's StartInterval must equal it; the wrapper refuses when they differ.
  poll_interval_s: 300
  # A headless session in any prompting mode blocks forever on its first tool call, having
  # consumed a claim and produced nothing (ai-readiness-kg DN-006 ADDENDUM_01, from the CLI's own
  # interface). The CLI and model come from seldon's model lock for the task's `**Model:**` role
  # or `primary` (AD-035 R3), never from this block.
  permission_mode: bypassPermissions
  stop_file: .seldon/DISPATCH_STOP
  # One instance, by flock, with an identified holder; reaped only by the operator, never by age.
  lease_file: .seldon/dispatch.lock
  # One log per dispatched task, `EXIT=` appended. Gitignored: what ships is the RESULT.
  log_dir: logs/dispatch
  # The finish signal: a local macOS banner (cron's MAILTO, systemd's OnSuccess=/OnFailure=). The
  # outcome arrives in the environment, never substituted into this text. A network notifier would
  # be an outbound send and is deliberately not the default.
  notify: >-
    osascript -e 'on run argv' -e 'display notification (item 1 of argv) with title "Seldon"'
    -e 'end run' "$SELDON_NOTIFY_TASK_NAME: $SELDON_NOTIFY_OUTCOME"
  notify_timeout_s: 30
  # The staleness alarm: one `dispatch_stuck` event per streak of this many passes refused on the
  # same criterion. NO MEASURED BASIS; ai-readiness-kg's value (fifteen minutes at 300 s).
  stuck_after_passes: 3
  # AD-034: one task at a time until a project opts into worktrees deliberately.
  max_parallel: 1
  # SEL-005: the launchd job that runs the passes (scripts/jobs/com.brock.seldon-dispatch.plist,
  # installed by symlink). `seldon go` reports `dispatch: on` only while it is loaded.
  launchd_label: com.brock.seldon-dispatch
  cadence: []

jobs:
  # The launchd wrapper's log caps (scripts/jobs/seldon_dispatch.sh), ai-readiness-kg's
  # `controls.yaml jobs.biblio_resume` values and reasons: 2000 characters per line is the
  # log-bomb guard set there after one exception wrote ~230,000 lines; 2 MiB per log before
  # rotation is ~40x a normal run; 30 days of rotated logs.
  dispatch:
    log_max_line_chars: 2000
    log_max_run_bytes: 2097152
    log_retention_days: 30
