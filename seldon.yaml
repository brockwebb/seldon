event_store:
  path: seldon_events.jsonl
neo4j:
  database: seldon-seldon-self
  uri: bolt://localhost:7687
project:
  created_at: '2026-03-16T00:55:34.088334Z'
  domain: research
  name: seldon-self
  slug: seldon-self

shared_ontology:
  # Per AD-017: Central Validity Ontology
  # Seldon repo owns the master vocabulary files.
  # ingest reads both vocabularies and writes to seldon-ontology master DB.
  # Relative to this file's directory, so every checkout and every git worktree
  # reads its OWN vocabulary tree. An absolute path here named one clone and
  # made worktree vocabulary edits untestable (defect sweep RESULT §7.6).
  source: ontology/
  vocabularies:
    - validity/VALIDITY_VOCABULARY.md
    - practitioner/PRACTITIONER_VOCABULARY.md
  inheritance: read-only
